# SPDX-License-Identifier: MIT
#
# The licence election for FerriteCAD's two shipped Rust binaries.
#
# This file is the policy half of ADR 0002. `cargo-deny` decides whether a
# licence expression may enter the graph at all; this decides which term of an
# accepted expression FerriteCAD actually takes, and therefore which text the
# notice must carry.
#
# `accepted` is in priority order and the order is the decision:
#
#   * MIT before Apache-2.0. Both are acceptable; MIT is the project's own
#     licence and the shorter obligation, so a dual-licensed crate is taken
#     under MIT.
#   * No GPL, AGPL or LGPL identifier appears here at all. `self_cell` is
#     published as `Apache-2.0 OR GPL-2.0-only`; because GPL-2.0-only is not
#     accepted the expression is satisfied by Apache-2.0, and the GPL term is
#     never elected. A crate whose only term were GPL-family would not be
#     satisfied by this list and would fail generation rather than pass quietly.
#   * An expression this list cannot satisfy is a refusal, not a skip:
#     tools/generate-rust-notices.sh passes --fail.
#
# The per-crate `clarify` blocks below are not exceptions to that policy. Each
# names a licence file that the published crate really does ship but that
# askalono did not recognise at the pinned threshold, and binds it by SHA-256
# so the text cannot change under the clarification. Crates that publish no
# licence file at all are not clarified here; they are in
# tools/notices/upstream-texts.tsv, which binds an upstream file to the exact
# commit the crate was published from.
#
# Dev-dependencies are excluded because they are in neither shipped binary.
# Build-dependencies are kept: they are not linked into the product, but they
# are part of producing it, and over-reporting them costs a listing while
# under-reporting them would need an argument this project has not made.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Font licences, not general software licences, scoped to the one crate whose
# four embedded font files were reviewed. This mirrors the exception already in
# deny.toml; both permit bundling and require their terms to travel with the
# font, so the notice carries them verbatim.
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]

# --- Licence files the published crate ships but askalono did not match -----
#
# Every checksum below is over a file inside the published crate, so nothing
# here depends on a network fetch or on an upstream repository still existing.

# lower-case, hyphenated file name; one identical text across the family
[windows.clarify]
license = "MIT"
files = [{ path = "license-mit", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]


# Apache-2.0 AND MIT: both terms are required, so both texts are bound.
# The MIT term covers the libm-derived code vendored into the crate.
[dpi.clarify]
license = "Apache-2.0 AND MIT"
files = [
    { path = "LICENSE", checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a", license = "Apache-2.0" },
    { path = "LICENSE-LIBM-MIT", checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997", license = "MIT" },
]

# The crate carries its real licence beside a vendored REUSE tree whose
# LICENSES/MIT.txt is the unfilled MIT template. Both were detected as MIT, so
# the notice quoted a text with no copyright notice in it. Naming the real file
# drops the template.
[wayland-protocols-plasma.clarify]
license = "MIT"
files = [{ path = "LICENSE.txt", checksum = "1cb6f4dee8c649f175736380495f0af0c753c87f22d50931692968bb24bf2161" }]

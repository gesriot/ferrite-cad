# SPDX-License-Identifier: MIT
[package]
name = "ferritecad-app"
description = "The FerriteCAD window: event loop, surface and frame composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ferritecad-viewer"
path = "src/main.rs"

# The only crate that owns a window, an event loop and a surface. Everything it
# decides was decided elsewhere and tested there: what a drag means lives in
# ferritecad-ui, what a frame is lives in ferritecad-viewport-gpu.
#
# winit without default features: the defaults pull Wayland client-side
# decorations, and those pull an unmaintained font parser that this project's
# cargo-deny policy refuses. A viewport does not draw its own title bar.
[dependencies]
ferritecad-document.workspace = true
ferritecad-kernel.workspace = true
ferritecad-occt.workspace = true
ferritecad-scene.workspace = true
ferritecad-sketch-solver.workspace = true
ferritecad-types.workspace = true
ferritecad-ui.workspace = true
ferritecad-viewport.workspace = true
ferritecad-viewport-gpu.workspace = true

egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
# The system file dialog, and deliberately nothing else it offers.
#
# The features are named rather than taken by default, for the same reason
# winit's are: a default that changes is a dependency tree that changes without
# anyone deciding to. They cost two crates in total – rfd itself, and
# objc2-app-kit on macOS. Everything the Linux backend needs is already here
# through wgpu and winit.
#
# Measured before it was adopted. rfd 0.15 reaches the XDG portal through ashpd
# and zbus, which is seventy-two crates including a whole async runtime and
# ICU; 0.17 speaks the portal protocol itself. `wayland` is free here because
# winit already brings those crates, and it is what lets the dialog belong to
# this window rather than float loose.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
wgpu = "=30.0.0"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }

# Forwarded, never re-decided. Whether there is a planegcs to load is
# `ferritecad-sketch-solver`'s question, and this crate has no opinion of its
# own to offer: a second build/link detection here would be a second answer,
# free to disagree with the first, and the disagreement would be invisible
# because both halves would go on compiling.
#
# Since 21B-1b this also arms the rebuild path. `ferritecad-eval` depends on
# the same `ferritecad-sketch-solver`, and a package is compiled once per build
# with the union of the features anything asked of it, so the evaluator this
# binary reaches through `ferritecad-scene` is the one linked against the
# library. Naming the same feature again through the scene would not add a
# second link decision, only a second place to forget one.
[features]
planegcs = ["ferritecad-sketch-solver/planegcs"]

# Only the tests read a document from disk: the committed plate is what an
# end-to-end gate needs to click a face the document actually names.
#
# ferritecad-eval is here for one reason: a gate that names the edges along a
# sweep needs to know which profile segments meet, and `ProfileLoop::joints` is
# where that is decided. Pairing the sketch curves in the test instead would be
# a second piece of adjacency arithmetic, free to disagree with the first.
[dev-dependencies]
ferritecad-eval.workspace = true
ferritecad-exchange.workspace = true
ferritecad-fixtures.workspace = true
tempfile = "3"

[lints]
workspace = true

# SPDX-License-Identifier: MIT
[package]
name = "ferritecad-viewport"
description = "Immutable render snapshots, camera and draw list for viewing a model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No document and no geometry kernel. This crate turns meshes and placements
# into something a GPU can consume; where they came from is the caller's
# business, and a renderer that knew about documents would end up deciding when
# to redraw them. `ferritecad-kernel` is the mesh vocabulary only – a contract
# crate with no Open CASCADE behind it.
[dependencies]
ferritecad-kernel.workspace = true
ferritecad-types.workspace = true

# No direct serialisation dependency, deliberately. `PickId` implements no
# serialisation trait; its raw u32 exists only because that is what a GPU pick
# buffer stores, and has meaning only against the snapshot that rendered it.
[lints]
workspace = true

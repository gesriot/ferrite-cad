[package]
name = "ferritecad-cli"
description = "Command line tools for inspecting and validating FerriteCAD documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ferritecad"
path = "src/main.rs"

[dependencies]
ferritecad-document.workspace = true
ferritecad-eval.workspace = true
ferritecad-exchange.workspace = true
ferritecad-export.workspace = true
ferritecad-jobs.workspace = true
ferritecad-kernel.workspace = true
ferritecad-occt.workspace = true
# The one crate that knows a document, a rebuild, a stored import and a kernel
# at once, and so the one that builds the neutral `ExportScene` the FBX writer
# is handed. Reached through `ferritecad-jobs` on the export route, and named
# here as well because the STL export and the topology report are built on it.
ferritecad-scene.workspace = true
ferritecad-types.workspace = true

clap = { version = "4", features = ["derive"] }

# The vertical gate ends in pixels, so the test needs a GPU. Dev-only: the
# command line neither opens a window nor draws anything.
[dev-dependencies]
ferritecad-fixtures.workspace = true
ferritecad-viewport.workspace = true
ferritecad-viewport-gpu.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

# Forwarded through the evaluator, which is what puts a solver on this binary's
# rebuild path. Same rule as the viewer: this crate re-decides nothing about
# whether a library is there.
[features]
planegcs = [
    "ferritecad-eval/planegcs",
    "ferritecad-jobs/planegcs",
    "ferritecad-scene/planegcs",
]

[lints]
workspace = true

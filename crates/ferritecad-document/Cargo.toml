[package]
name = "ferritecad-document"
description = "FerriteCAD native document: SQLite container, CBOR object envelopes, dependency graph and cache sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# ferritecad-exchange supplies the one thing a document must store about an
# imported file and must not re-describe in its own words: the handle-free
# projection of a scene, which is also what re-binding compares against. Two
# definitions of that projection would be two things obliged to agree, and the
# whole point of this slice is that they cannot silently stop agreeing.
#
# ferritecad-kernel arrives with it and is named explicitly for one purpose:
# KernelIdentity, recorded as provenance of an import. Nothing here calls a
# kernel, links one, or needs one present to open a document.
[dependencies]
ferritecad-exchange.workspace = true
ferritecad-kernel.workspace = true
ferritecad-types.workspace = true

ciborium = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

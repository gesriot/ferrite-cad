# SPDX-License-Identifier: MIT
[package]
name = "ferritecad-scene"
description = "Turning a stored document into a picture of what it describes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The one place that knows both a document and a viewport. Deliberately not a
# window and not a kernel: a kernel is handed in, so this can be exercised
# against the mock without Open CASCADE present, and there is no event loop
# here for a long load to block.
[dependencies]
ferritecad-document.workspace = true
ferritecad-eval.workspace = true
ferritecad-exchange.workspace = true
# The neutral export model. This crate is the one place that knows a document,
# a rebuild, a stored import and a kernel at once, so building that model is
# its job; what the model is allowed to be is the export crate's.
ferritecad-export.workspace = true
ferritecad-kernel.workspace = true
ferritecad-types.workspace = true
ferritecad-viewport.workspace = true

# The catalogue is the durable half of a picture, so it is a thing a caller can
# store. Nothing else here is serialised, and the snapshot beside it never can
# be: it holds identities that mean nothing outside the session that made them.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ferritecad-fixtures.workspace = true
# Only to show that a catalogue entry can be written down and read back.
serde_json = "1"
# The pin run must see the real kernel produce the real plate. Dev-only: this
# crate never names an implementation, so a viewer could use another one.
ferritecad-occt.workspace = true
# Only to put a document into a state another program could have left it in,
# so that reading it can be shown not to rewrite it.
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
# Test-only, and only to ask whether there is a solver to skip for. What
# solves a sketch is the evaluator, and this crate never states one anything:
# a gate that could not tell "no library here" from "the facts were lost"
# would pass in the build where it matters least.
ferritecad-sketch-solver.workspace = true

# Forwarded to the two crates that decide it, never re-decided. This crate has
# no build script and no link detection, and a second opinion about whether a
# solver exists is the one thing that could disagree with the rebuild path it
# is gating.
[features]
planegcs = [
    "ferritecad-eval/planegcs",
    "ferritecad-sketch-solver/planegcs",
]

[lints]
workspace = true

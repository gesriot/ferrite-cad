# SPDX-License-Identifier: MIT
[package]
name = "ferritecad-solver-lab"
description = "The bench that chose FerriteCAD's sketch solver and keeps it honest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A decision and regression instrument, not a product crate. Nothing in the
# document or UI depends on it.
publish = false

# Deliberately nothing. A comparison of solvers must not be shaped by what a
# linear algebra crate happens to make easy, and the numerics needed here fit
# in a few hundred lines that can be read.
[dependencies]

# planegcs is LGPL-2.0-or-later and off by default. Turning it on needs a
# shared library built by tools/build-planegcs.sh and pointed at with
# FCAD_PLANEGCS_DIR; it is never compiled into a FerriteCAD binary.
[features]
planegcs = []

[lints]
workspace = true

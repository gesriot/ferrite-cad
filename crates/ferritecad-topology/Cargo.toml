[package]
name = "ferritecad-topology"
description = "Resolves a document's durable topology references to the geometry a rebuild just produced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The document supplies the durable half of a name and the kernel the transient
# half; this crate joins them. Nothing else belongs here: no Open CASCADE, no
# FFI, no interface, no scheduler and no cache storage. If this list grows, the
# boundary this crate exists to hold has moved.
[dependencies]
ferritecad-document.workspace = true
ferritecad-kernel.workspace = true
ferritecad-types.workspace = true

[lints]
workspace = true

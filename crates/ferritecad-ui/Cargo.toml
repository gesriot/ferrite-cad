# SPDX-License-Identifier: MIT
[package]
name = "ferritecad-ui"
description = "Panels and input handling for the FerriteCAD viewport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No window, no surface, no renderer and no event loop. This crate decides what
# a gesture means and what the panels say; who delivered the gesture and who
# draws the result are somebody else's problem, which is what lets the deciding
# be tested without any of it.
[dependencies]
ferritecad-types.workspace = true
ferritecad-viewport.workspace = true

# Default features, which is what brings the bundled typefaces. Text is the
# larger half of an interface, and a build without a font draws none of it.
# The four fonts and their licences are listed in THIRD_PARTY_LICENSES.md.
egui = "0.36"

# Only to build a mesh to hand to the reducer, which is the kernel's vocabulary
# for one. Nothing in the shipped graph points from panels at a kernel.
[dev-dependencies]
ferritecad-kernel.workspace = true

[lints]
workspace = true

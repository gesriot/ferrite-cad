[workspace]
resolver = "3"
members = [
    "crates/ferritecad-app",
    "crates/ferritecad-types",
    "crates/ferritecad-document",
    "crates/ferritecad-eval",
    "crates/ferritecad-exchange",
    "crates/ferritecad-export",
    "crates/ferritecad-fixtures",
    "crates/ferritecad-kernel",
    "crates/ferritecad-occt",
    "crates/ferritecad-scene",
    "crates/ferritecad-solver-lab",
    "crates/ferritecad-topology",
    "crates/ferritecad-ui",
    "crates/ferritecad-viewport",
    "crates/ferritecad-viewport-gpu",
    "crates/ferritecad-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ferrite-cad/ferrite-cad"
authors = ["FerriteCAD contributors"]

[workspace.dependencies]
ferritecad-types = { path = "crates/ferritecad-types", version = "0.0.1" }
ferritecad-document = { path = "crates/ferritecad-document", version = "0.0.1" }
ferritecad-eval = { path = "crates/ferritecad-eval", version = "0.0.1" }
ferritecad-exchange = { path = "crates/ferritecad-exchange", version = "0.0.1" }
ferritecad-export = { path = "crates/ferritecad-export", version = "0.0.1" }
ferritecad-fixtures = { path = "crates/ferritecad-fixtures", version = "0.0.1" }
ferritecad-kernel = { path = "crates/ferritecad-kernel", version = "0.0.1" }
ferritecad-occt = { path = "crates/ferritecad-occt", version = "0.0.1" }
ferritecad-scene = { path = "crates/ferritecad-scene", version = "0.0.1" }
ferritecad-topology = { path = "crates/ferritecad-topology", version = "0.0.1" }
ferritecad-ui = { path = "crates/ferritecad-ui", version = "0.0.1" }
ferritecad-viewport = { path = "crates/ferritecad-viewport", version = "0.0.1" }
ferritecad-viewport-gpu = { path = "crates/ferritecad-viewport-gpu", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Errors from external input must never be handled with unwrap/expect.
# `expect` remains allowed for internal invariants; see CLAUDE.md 5.2.
unwrap_used = "deny"
panic = "warn"

# arrayref 0.3.10 was published without a corresponding upstream commit and
# added an unrelated dependency chain; the previously clean registry releases
# were yanked at the same time. Pin the last reviewed upstream commit rather
# than allowing Cargo to resolve that release. Remove this patch only after the
# registry incident has been resolved and the replacement source reviewed.
[patch.crates-io]
arrayref = { git = "https://github.com/droundy/arrayref", rev = "f8d0299d863922db6c409d08098941e833b70d69" }

# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears locally is a warning nobody fixes.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints are platform-independent, so they run once rather
  # than three times.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A file that leaves this repository without a licence header carries no
      # licence at all. Checked mechanically so it stays true.
      - run: tools/check-licence-headers.sh
      - run: tools/check-step-corpus.sh

      # One crate owns the sketch solver boundary. Both halves keep compiling
      # if a second copy appears, so this is checked rather than remembered.
      - run: tools/check-solver-ownership.sh

      # And one file owns planegcs's native build inputs. A second copy of a
      # version or a digest, or a Boost taken from a package manager, keeps
      # every workflow green while making the release input a property of a
      # runner image, so it is checked here rather than in the workflow that
      # would inherit it.
      - run: tools/check-planegcs-pins.sh

      # And one file owns the notice generator's identity and the roots the
      # notices are taken from. This needs no toolchain and no network, so it
      # rides along here rather than waiting for the job that runs the
      # generator.
      - run: tools/check-notice-ownership.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three are product targets. macOS is not a courtesy build: a
        # failure here blocks the merge exactly as the others do.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

      # A passive trap, armed before the tests and touching nothing about how
      # they run. Windows has twice killed a test process with
      # STATUS_ACCESS_VIOLATION and no Rust panic, and a rerun passed both
      # times, so the evidence disappeared with the process. Four probe rounds
      # failed to reproduce it on demand, so the next natural occurrence is the
      # next chance to see a stack. This only asks Windows to write a dump if a
      # process dies; it does not retry, skip, serialise or reconfigure
      # anything.
      - name: Arm Windows crash dumps
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'crashdumps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dir -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord
          # 2 is a full dump, which is what makes a stack readable afterwards.
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord

      - run: cargo test --workspace

      # Only when something already failed, and only on the platform the trap
      # is set on. A green run prints nothing and uploads nothing.
      - name: Whether Windows left a crash dump
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'crashdumps'
          $dumps = Get-ChildItem $dir -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) {
            "no crash dump was written, so this failure was not a process death"
            exit 0
          }
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' `
            -ErrorAction SilentlyContinue
          foreach ($d in $dumps) {
            "=== $($d.Name) ($($d.Length) bytes) ==="
            if ($cdb) {
              & $cdb.FullName -z $d.FullName -c '.ecxr; k 40; ~*k 20; q' 2>&1 |
                Select-Object -First 400
            } else {
              "cdb is not on this image; the dump is uploaded as an artefact instead"
            }
          }

      - name: Keep any Windows crash dump
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-crashdumps
          path: ${{ runner.temp }}/crashdumps
          if-no-files-found: ignore

      # The document format must behave identically on every platform, so the
      # command-line path is exercised rather than only the library tests.
      - name: Round-trip a document through the CLI
        shell: bash
        run: |
          set -euxo pipefail
          cargo run --quiet -p ferritecad-cli -- create part.fcad --sample
          cargo run --quiet -p ferritecad-cli -- validate part.fcad
          cargo run --quiet -p ferritecad-cli -- inspect part.fcad
          cargo run --quiet -p ferritecad-cli -- dump-graph part.fcad --format dot
          cargo run --quiet -p ferritecad-cli -- clear-cache part.fcad

  # The notice inventory remains exact even though ADR 0003 makes unresolved
  # licence evidence non-blocking. A future packager may invoke the same gate
  # with --release-ready; that spelling checks the package-boundary inventory
  # and is not legal clearance.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The version comes from the pin and is not repeated here;
      # tools/check-notice-ownership.sh refuses a second copy of it. RUSTFLAGS
      # is cleared for the install only: the repository denies warnings in its
      # own code, and a warning inside a third-party build tool is not a reason
      # to be unable to install it.
      - name: Install the pinned notice generator
        env:
          RUSTFLAGS: ''
        run: |
          set -euo pipefail
          . tools/notices/pin.env
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli

      # The generator runs cargo `--frozen`, so the sources have to be present
      # before it starts.
      - run: cargo fetch --locked
      - run: tools/check-rust-notices.sh

  # The Rust half of the product SBOM. A fragment, and it says so in its own
  # metadata: the native and asset merge is a later slice. This job proves the
  # checked-in fragments are neither stale nor host-specific and that an
  # independent oracle agrees about their composition. ADR 0003 keeps recorded
  # licence risk out of the exit code.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The versions come from the pin and are not repeated here. RUSTFLAGS is
      # cleared for the installs only, for the same reason as the notices job.
      - name: Install the pinned SBOM tools
        env:
          RUSTFLAGS: ''
        run: |
          set -euo pipefail
          . tools/sbom/pin.env
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo install jsonschema-cli --version "$JSONSCHEMA_CLI_VERSION" --locked

      - run: cargo fetch --locked
      - run: tools/check-rust-sbom.sh

  # Security advisories, dependency bans and source policy remain gates.
  # Licence policy is still reported, but ADR 0003 makes it advisory so an
  # unresolved or newly disallowed expression cannot stop product work.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
      - name: Report cargo-deny licence findings
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

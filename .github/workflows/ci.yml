            sessions::tests::checkpoints::the_checkpoint_predicate_says_why_and_waits_for_forms_operations_names_and_the_limit \
            sessions::tests::checkpoints::a_crash_copy_of_the_window_carries_its_checkpoints \
            sessions::tests::tabs::two_copies_of_one_document_are_two_tabs_with_their_own_history_saves_and_checkpoints \
            sessions::tests::tabs::opening_a_file_open_by_any_name_shows_its_tab_and_copies_are_new_tabs \
            sessions::tests::tabs::save_as_onto_another_tabs_file_is_refused_and_the_existing_guards_still_hold \
            sessions::tests::tabs::closing_asks_only_about_unsaved_tabs_and_cancel_or_a_failed_save_keeps_the_tab \
            sessions::tests::tabs::quit_asks_every_unsaved_tab_in_turn_and_cancel_part_way_closes_nothing \
            sessions::tests::tabs::quit_waits_for_open_forms_and_foreground_work_even_when_tabs_are_clean \
            sessions::tests::tabs::a_cancelled_switch_reply_is_ignored_while_an_apply_runs \
            sessions::tests::tabs::a_cancelled_switch_keeps_its_input_alive_until_its_worker_finishes \
            sessions::tests::tabs::each_tab_keeps_its_own_files_and_crash_copy_and_closing_frees_only_its_own \
            sessions::tests::tabs::the_ninth_document_is_refused_before_anything_changes \
            sessions::tests::tabs::restore::reopen_waits_for_a_gesture_and_is_offered_only_with_a_list
          do
            cargo test -p ferritecad-app --bin ferritecad-viewer "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee session-app.log
            if grep -q 'skipped:' session-app.log || ! grep -Fq "test $gate ... ok" session-app.log; then exit 1; fi
          done
      - name: Exercise tab drafts and Close questions without native geometry
        shell: bash
        run: |
          set -euo pipefail
          # §30M: prints its marker, so libtest's "ok" follows on a line of its own.
          gate=sessions::tests::recovery::stub_recovery_is_refused_at_the_picture_and_keeps_the_record_and_the_open_document
          cargo test -p ferritecad-app --bin ferritecad-viewer "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee recovery-app.log
          if grep -q 'skipped:' recovery-app.log; then exit 1; fi
          grep -Fq "test $gate ... " recovery-app.log
          grep -q '^test result: ok\. 1 passed; 0 failed' recovery-app.log
          grep -q '^FCAD_30M_STUB_RECOVERY_EXECUTED$' recovery-app.log
          # §30N: Create, Delete and extraction without a kernel; Restore refused at
          # its picture. Prints its marker, so "ok" follows on a line of its own.
          gate=sessions::tests::checkpoints::stub_checkpoints_work_and_restore_is_refused_at_the_picture
          cargo test -p ferritecad-app --bin ferritecad-viewer "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee checkpoint-app.log
          if grep -q 'skipped:' checkpoint-app.log; then exit 1; fi
          grep -Fq "test $gate ... " checkpoint-app.log
          grep -q '^test result: ok\. 1 passed; 0 failed' checkpoint-app.log
          grep -q '^FCAD_30N_STUB_CHECKPOINTS_EXECUTED$' checkpoint-app.log
          # §30O: late, cancelled and foreign answers through the tab list, and a
          # switch refused at its picture without a kernel. §30P: each tab's open
          # forms kept, refused, closed, quit and drawn per tab, and a switch refused
          # at its picture keeping both drafts. §30Q: Open, New and Recover beside
          # open forms, New's focus apart from a tab's, and all three refused at
          # their picture without a kernel. §30T: Open while New is not finished —
          # the question bound to its New, the abandoned creation and its late answer,
          # a creation that became a tab first, the full window, the one narrow
          # exception, the question's real widgets, and the refusals without a
          # kernel. §30R: the last window's list — format,
          # refusals, a failed publication, native paths, two processes at once —
          # kept only at the end of Quit, reopened beside open tabs, Cancel and late
          # answers, and refused at the picture without a kernel. Every one prints a
          # marker.
          for check in \
            "sessions::tests::tabs::late_cancelled_or_foreign_answers_change_no_tab_and_release_no_slot FCAD_30O_LATE_ANSWERS_EXECUTED" \
            "sessions::tests::tabs::stub_switching_is_refused_at_the_picture_and_keeps_the_shown_tab FCAD_30O_STUB_TABS_EXECUTED" \
            "sessions::tests::tabs::drafts::height_drafts_of_two_copies_stay_literal_and_apply_only_to_their_own_tab FCAD_30P_HEIGHT_DRAFTS_EXECUTED" \
            "sessions::tests::tabs::drafts::constraint_drafts_with_one_set_of_ids_keep_picks_changes_and_history_per_tab FCAD_30P_CONSTRAINT_DRAFTS_EXECUTED" \
            "sessions::tests::tabs::drafts::vertex_drafts_of_two_copies_keep_their_own_text_and_draft_history FCAD_30P_VERTEX_DRAFTS_EXECUTED" \
            "sessions::tests::tabs::drafts::running_work_holds_the_window_and_failed_or_foreign_answers_keep_both_drafts FCAD_30P_REFUSED_SWITCHES_EXECUTED" \
            "sessions::tests::tabs::drafts::close_and_quit_keep_an_open_form_even_over_a_clean_model FCAD_30P_CLOSE_QUIT_FORMS_EXECUTED" \
            "sessions::tests::tabs::drafts::a_draft_made_on_another_version_comes_back_held_and_is_never_applied FCAD_30P_STALE_DRAFT_EXECUTED" \
            "sessions::tests::tabs::drafts::the_same_control_in_two_tabs_shares_no_focus_or_text FCAD_30P_FORM_FOCUS_EXECUTED" \
            "sketch::tests::floating_forms_in_two_tabs_do_not_share_keyboard_focus FCAD_30P_FLOATING_FORM_FOCUS_EXECUTED" \
            "sessions::tests::tabs::drafts::stub_a_refused_switch_keeps_both_drafts FCAD_30P_STUB_DRAFTS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_new_recover::open_over_unfinished_forms_keeps_them_with_their_tab_through_every_answer FCAD_30Q_OPEN_OVER_FORMS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_new_recover::new_over_unfinished_forms_sets_them_aside_and_gives_them_back_exactly FCAD_30Q_NEW_OVER_FORMS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_new_recover::recover_over_an_unfinished_form_keeps_the_record_on_every_refusal FCAD_30Q_RECOVER_OVER_FORMS_EXECUTED" \
            "sketch::tests::new_over_forms::new_opened_over_a_floating_form_shares_no_focus_or_text_with_it FCAD_30Q_NEW_FORM_FOCUS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_new_recover::stub_open_new_and_recover_beside_a_form_are_refused_at_the_picture_and_keep_it FCAD_30Q_STUB_OVER_FORMS_EXECUTED" \
            "last_tabs::tests::a_published_list_reads_back_exactly_and_reading_writes_nothing FCAD_30R_DESCRIPTOR_ROUND_TRIP_EXECUTED" \
            "last_tabs::tests::damaged_foreign_or_unknown_lists_are_refused_and_left_as_they_are FCAD_30R_DESCRIPTOR_REFUSALS_EXECUTED" \
            "last_tabs::tests::a_failed_publication_keeps_the_previous_list_whole_and_touches_nothing_else FCAD_30R_FAILED_PUBLICATION_EXECUTED" \
            "last_tabs::tests::paths_keep_their_native_units_exactly FCAD_30R_NATIVE_PATHS_EXECUTED" \
            "last_tabs::tests::two_processes_publish_whole_lists_and_one_of_them_stays FCAD_30R_TWO_PROCESSES_EXECUTED" \
            "sessions::tests::tabs::restore::quit_keeps_the_saved_files_only_when_the_window_really_ends FCAD_30R_QUIT_PUBLICATION_EXECUTED" \
            "sessions::tests::tabs::restore::an_empty_end_clears_the_offer_and_a_list_that_cannot_be_kept_stops_quit_once FCAD_30R_EMPTY_AND_FAILED_LIST_EXECUTED" \
            "sessions::tests::tabs::restore::reopen_restores_saved_files_beside_open_tabs_in_order_and_shows_the_last_shown FCAD_30R_REOPEN_EXECUTED" \
            "sessions::tests::tabs::restore::cancel_late_answers_and_a_full_window_never_revive_or_mix_a_reopen FCAD_30R_CANCEL_LATE_FULL_EXECUTED" \
            "sessions::tests::tabs::restore::stub_reopen_is_refused_at_the_picture_and_keeps_the_open_tab FCAD_30R_STUB_REOPEN_EXECUTED" \
            "sessions::tests::tabs::drafts::open_new_recover::recover_waiting_for_a_reader_obeys_cancel_late_answers_and_quit_beside_forms_in_two_tabs FCAD_30S_RECOVER_BESIDE_READER_EXECUTED" \
            "creates::tests::a_question_is_bound_to_the_new_it_was_asked_over FCAD_30T_QUESTION_GENERATION_EXECUTED" \
            "creates::tests::stopping_new_ends_its_draft_and_leaves_the_worker_to_end_on_its_own FCAD_30T_STOP_NEW_EXECUTED" \
            "creates::tests::an_abandoned_creation_never_answers_for_a_newer_one FCAD_30T_ABANDONED_NEVER_ANSWERS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::open_over_an_unfinished_new_asks_first_and_discards_only_when_told FCAD_30T_OPEN_OVER_NEW_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::a_saved_object_form_survives_a_discarded_drawing_exactly FCAD_30T_SAVED_FORM_SURVIVES_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::a_creation_under_way_is_abandoned_and_its_late_answer_changes_nothing FCAD_30T_OPEN_OVER_RUNNING_NEW_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::a_creation_that_becomes_a_tab_first_is_never_discarded FCAD_30T_OPEN_AFTER_NEW_BECAME_A_TAB_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::a_full_window_is_checked_before_anything_is_asked_or_discarded FCAD_30T_OPEN_OVER_NEW_FULL_WINDOW_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::open_alone_leaves_an_unfinished_new_and_every_other_hold_stays FCAD_30T_OPEN_NARROW_EXCEPTION_EXECUTED" \
            "sketch::tests::open_over_new::the_question_beside_new_keeps_its_text_and_focus_and_both_buttons_answer FCAD_30T_QUESTION_WIDGETS_EXECUTED" \
            "sessions::tests::tabs::drafts::open_over_new::stub_open_over_a_running_new_is_refused_at_the_picture_and_new_stays_gone FCAD_30T_STUB_OPEN_OVER_NEW_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::same_document_tabs_keep_literal_forms_and_history_until_their_own_close_succeeds FCAD_30U_TAB_FORMS_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::cancelled_close_and_refused_saves_return_the_original_form_and_accepted_model FCAD_30U_CANCEL_SAVE_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::close_decisions_are_once_only_and_address_the_tab_attempt_and_snapshot FCAD_30U_ADDRESS_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::every_existing_form_family_uses_the_same_move_and_keeps_its_entire_state FCAD_30U_FORM_FAMILIES_EXECUTED families=12" \
            "sessions::tests::tabs::drafts::close_form::real_close_buttons_name_unapplied_values_and_parked_fields_cannot_take_typing FCAD_30U_WIDGETS_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::close_request_preserves_foreground_work_and_gesture_holds FCAD_30U_HOLDS_EXECUTED" \
            "sessions::tests::tabs::drafts::close_form::stub_hidden_close_refusal_keeps_both_forms_and_no_native_work_is_claimed FCAD_30U_STUB_EXECUTED"
          do
            gate="${check%% *}"
            marker="${check#* }"
            cargo test -p ferritecad-app --bin ferritecad-viewer "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee tabs-app.log
            if grep -q 'skipped:' tabs-app.log; then exit 1; fi
            grep -Fq "test $gate ... " tabs-app.log
            grep -q '^test result: ok\. 1 passed; 0 failed' tabs-app.log
            grep -Fxq "$marker" tabs-app.log
          done
          for gate in panels::tests::the_document_commands_are_offered_exactly_when_they_would_do_something \
            panels::tests::unsaved_changes_and_the_last_outcome_are_on_the_screen_in_words \
            panels::tests::new_form_create_asks_nothing_while_the_window_says_it_cannot \
            recovery::tests::recover_and_delete_ask_nothing_while_the_window_says_they_cannot \
            checkpoint::tests::the_buttons_ask_nothing_while_the_window_says_why_they_cannot \
            tabs::tests::tabs_show_names_marks_and_answer_with_their_key_only_when_available \
            reopen::tests::reopen_asks_nothing_while_the_window_says_it_cannot_and_says_what_opens \
            open_over_new::tests::the_question_says_what_is_lost_and_both_buttons_answer
          do
            cargo test -p ferritecad-ui --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee session-ui.log
            if ! grep -Fq "test $gate ... ok" session-ui.log; then exit 1; fi
          done

      - name: An idle redraw must not schedule another frame
        shell: bash
        run: |
          set -euo pipefail
          gate=tests::completing_a_redraw_does_not_schedule_itself_again
          cargo test -p ferritecad-app --bin ferritecad-viewer "$gate" -- --exact --nocapture 2>&1 | tee idle-redraw.log
          if grep -q 'skipped:' idle-redraw.log || ! grep -Fq "test $gate ... ok" idle-redraw.log; then exit 1; fi

      - name: Verify memory guard cleanup without a viewer
        if: runner.os == 'macOS'
        run: python3 tools/test-viewer-memory-guard.py

      # Stored validation needs no native libraries. Keep these process and
      # snapshot gates in ordinary CI on every OS, with actual execution checked.
      - name: Validate read-only documents through text and JSON
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ferritecad-cli --test validate -- --nocapture 2>&1 | tee validation.log
          for gate in validation_reports_match_shared_operation_without_writes \
                      validation_read_only_refusals_preserve_storage \
                      validation_json_arguments_and_closed_pipes \
                      validation_really_read_only_permissions; do
            grep -E "^test ${gate} \.\.\. ok$" validation.log
          done
          grep -F '4 passed; 0 failed; 0 ignored' validation.log
          if grep -Ei 'skipping|skipped|SKIP:' validation.log; then
            exit 1
          fi
          cargo test -p ferritecad-jobs validate::tests::validation_keeps_one_snapshot_and_closes_before_return -- --exact --nocapture 2>&1 | tee validation-job.log
          grep -E '^test validate::tests::validation_keeps_one_snapshot_and_closes_before_return \.\.\. ok$' validation-job.log
          grep -F '1 passed; 0 failed; 0 ignored' validation-job.log
          cargo test -p ferritecad-document --test snapshot validation_metadata_and_findings_hold_the_same_committed_snapshot -- --exact --nocapture 2>&1 | tee validation-snapshot.log
          grep -E '^test validation_metadata_and_findings_hold_the_same_committed_snapshot \.\.\. ok$' validation-snapshot.log
          grep -F '1 passed; 0 failed; 0 ignored' validation-snapshot.log
          cargo test -p ferritecad-document --test snapshot rollback_header_does_not_allow_writes_to_foreign_wal_sidecars -- --exact --nocapture 2>&1 | tee validation-sidecars.log
          grep -E '^test rollback_header_does_not_allow_writes_to_foreign_wal_sidecars \.\.\. ok$' validation-sidecars.log
          grep -F '1 passed; 0 failed; 0 ignored' validation-sidecars.log

      # The production FBX writer, read by pinned ufbx 0.23.0 in strict mode on
      # every product platform.
      #
      # Here rather than in the lint job because two of the three things it
      # proves are platform questions. The writer's own gates read what the
      # writer wrote with a reader written beside it, which cannot notice a
      # misunderstanding the two share; an independent reader can. And the
      # digests it compares are what turns "the same scene always produces the
      # same bytes" into a measured property of Linux, macOS and Windows rather
      # than a claim about one developer's machine: both gate scenes are
      # arithmetic over an in-memory value, so a digest that moves between
      # hosts is a writer that is no longer a function of its input.
      #
      # No Open CASCADE and no Unity take part. The complex assembly's FBX
      # needs a kernel and is gated by the OCCT pin workflow; the Unity import
      # needs the measured editor and is run locally.
      - name: Read the production FBX with pinned ufbx
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "${CC:-}" clang gcc cc; do
            [ -n "$candidate" ] || continue
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "C compiler: $("$candidate" --version | head -1)"
              break
            fi
          done
          tools/check-fbx-writer.sh

      # Only when something already failed, and only on the platform the trap
      # is set on. A green run prints nothing and uploads nothing.
      - name: Whether Windows left a crash dump
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'crashdumps'
          $dumps = Get-ChildItem $dir -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) {
            "no crash dump was written, so this failure was not a process death"
            exit 0
          }
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' `
            -ErrorAction SilentlyContinue
          foreach ($d in $dumps) {
            "=== $($d.Name) ($($d.Length) bytes) ==="
            if ($cdb) {
              & $cdb.FullName -z $d.FullName -c '.ecxr; k 40; ~*k 20; q' 2>&1 |
                Select-Object -First 400
            } else {
              "cdb is not on this image; the dump is uploaded as an artefact instead"
            }
          }

      - name: Keep any Windows crash dump
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-crashdumps
          path: ${{ runner.temp }}/crashdumps
          if-no-files-found: ignore

      # The document format must behave identically on every platform, so the
      # command-line path is exercised rather than only the library tests.
      - name: Round-trip a document through the CLI
        shell: bash
        run: |
          set -euxo pipefail
          cargo run --quiet -p ferritecad-cli -- create part.fcad --sample
          cargo run --quiet -p ferritecad-cli -- validate part.fcad
          cargo run --quiet -p ferritecad-cli -- inspect part.fcad
          cargo run --quiet -p ferritecad-cli -- dump-graph part.fcad --format dot
          cargo run --quiet -p ferritecad-cli -- clear-cache part.fcad

  # The notice inventory remains exact even though ADR 0003 makes unresolved
  # licence evidence non-blocking. A future packager may invoke the same gate
  # with --release-ready; that spelling checks the package-boundary inventory
  # and is not legal clearance.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The version comes from the pin and is not repeated here;
      # tools/check-notice-ownership.sh refuses a second copy of it. RUSTFLAGS
      # is cleared for the install only: the repository denies warnings in its
      # own code, and a warning inside a third-party build tool is not a reason
      # to be unable to install it.
      - name: Install the pinned notice generator
        env:
          RUSTFLAGS: ''
        run: |
          set -euo pipefail
          . tools/notices/pin.env
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli

      # The generator runs cargo `--frozen`, so the sources have to be present
      # before it starts.
      - run: cargo fetch --locked
      - run: tools/check-rust-notices.sh

  # The product SBOM and the two intermediate documents it is merged from. The
  # fragment describes only the Rust components and says so; the inventory
  # describes only the native components, the build inputs and the embedded
  # assets and says so; the merged document under sbom/product is the one that
  # describes the delivered product for a target. This job proves all three are
  # neither stale nor host-specific and that an independent oracle agrees about
  # each. ADR 0003 keeps recorded licence risk out of the exit code.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The versions come from the pin and are not repeated here. RUSTFLAGS is
      # cleared for the installs only, for the same reason as the notices job.
      - name: Install the pinned SBOM tools
        env:
          RUSTFLAGS: ''
        run: |
          set -euo pipefail
          . tools/sbom/pin.env
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo install jsonschema-cli --version "$JSONSCHEMA_CLI_VERSION" --locked

      - run: cargo fetch --locked
      - run: tools/check-rust-sbom.sh

      # The half of the native/assets inventory that needs no staged layout:
      # the document is schema-valid, says in its own fields that it is not a
      # product SBOM, carries nothing about the machine that produced it, two
      # runs of its generator reproduce the committed bytes, every version and
      # digest agrees with the file that owns it, every embedded asset exists
      # and hashes to what is written down, and the Rust fragments above are
      # byte for byte the ones it was written against. The file boundary needs
      # a real staged layout and is checked by the combined runtime layout
      # workflow, which is the only thing that produces one.
      - run: tools/check-native-inventory.sh

      # And the merge of the two. This is the first document in the repository
      # that claims to describe the whole product: the Rust components of both
      # shipped binaries, the native libraries the delivery carries, the native
      # inputs that only take part in a build, and the files those binaries
      # embed. The gate proves it is not stale, that it is schema-valid, that
      # it carries nothing about the machine that merged it, and that an oracle
      # built from the two inputs rather than from the merge agrees about every
      # component and every relationship. That the merge is the same on every
      # host is the separate product sbom workflow's claim.
      - run: tools/check-product-sbom.sh

      # And the packager, on a staging directory this gate builds itself.
      # Whether a release archive can be extracted on a machine with no build
      # tree and started there is the combined runtime layout workflow's
      # question and only it can answer it. Everything else about a package is
      # arithmetic over a directory - a file with two owners, a file with none,
      # a manifest describing the bytes it was written from rather than the
      # ones that came out, an absolute path, a symlink where a payload file
      # should be, a lost executable bit, two top-level directories - and
      # waiting for a runner to build Open CASCADE before asking about those
      # would mean asking about them roughly never.
      - run: tools/check-packager.sh

      # And the release set, on archives that gate builds for itself. A single
      # archive verifying beautifully says nothing about whether the three that
      # were uploaded are one product: a target missing, a target twice, a
      # fourth target, two product versions, two source revisions, a package
      # manifest too old to record a revision, an archive renamed or replaced
      # after the set was assembled, a checksums file that does not say what
      # the archives hash to. All of that is arithmetic over three files and
      # two documents, and only whether the archives really run needs three
      # runners.
      - run: tools/check-release-set-builder.sh

  # Security advisories, dependency bans and source policy remain gates.
  # Licence policy is still reported, but ADR 0003 makes it advisory so an
  # unresolved or newly disallowed expression cannot stop product work.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
      - name: Report cargo-deny licence findings
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

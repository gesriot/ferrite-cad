# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every other workflow here already has this and CI did not, which was an
  # oversight rather than a decision. An Actions outage on 2026-08-26 left a
  # merged commit on main with no CI run and no way to ask for one: the run was
  # never created, so there was nothing to re-run, and the only remaining way
  # to get CI onto that tree was to change it. A gate that cannot be asked to
  # run is a gate that goes missing exactly when something has already gone
  # wrong.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears locally is a warning nobody fixes.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints are platform-independent, so they run once rather
  # than three times.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A file that leaves this repository without a licence header carries no
      # licence at all. Checked mechanically so it stays true.
      - run: tools/check-licence-headers.sh
      - run: tools/check-step-corpus.sh

      # The export model must stay a model: no document, no loader, no kernel
      # implementation, no GPU. A dependency that broke that would compile
      # perfectly, and one more load path would only show up as a document
      # read nobody counted. The same gate now also checks the shipped
      # `export-fbx` route: that it is handed the hierarchical scene rather
      # than a flattened picture, reads the document once, calls the writer
      # once, opens nothing but its own scratch file, publishes only after the
      # writer has finished, and reports from the writer's own record.
      - run: tools/check-export-boundary.sh

      # The §22B-1e1 Unity identity measurement, minus the editor. Unity is run
      # locally on the one measured version, exactly as the FBX writer gate
      # below explains; what runs here is the half that needs neither an editor
      # nor a kernel. The recorded canonical measurement is re-joined to the
      # independent `ufbx` reading of the same bytes, the transition table is
      # rebuilt and compared, and the semantic mutation campaign is run against
      # the real verifier. A recorded measurement no gate reads is a file.
      - run: tools/unity-fbx-identity/scripts/check_identity_record.sh

      # The §22B-1e2a channel measurement, minus the editor, for the same
      # reason. Both recorded editor runs are re-joined to the independent
      # `ufbx` reading of the same bytes, the decision record is rebuilt and
      # compared, and the semantic mutation campaign is run against the real
      # verifier. The decision table read from that record is a document; the
      # record itself is a gate.
      - run: tools/unity-identity-channel/scripts/check_channel_record.sh

      # The §22B-1e2b graph and importer-API measurement, minus the editor, for
      # the same reason. All five recorded editor runs are re-joined to the
      # independent `ufbx` reading of the same bytes, the measurement-only
      # structural transformer is held to its claim against the control —
      # geometry arrays, material colours, node transforms and existing object
      # numbers — the decision record is rebuilt and compared, and the semantic
      # mutation campaign is run against the real verifier.
      - run: tools/unity-identity-graph/scripts/check_graph_record.sh

      # The §22B-1e3b measurement of what the real editor makes of the identity
      # channel in the shipped file, minus the editor. The decision record is
      # rebuilt from the recorded report and compared with the committed one,
      # and the semantic mutation campaign is run against the real verifier —
      # including the four metamorphic controls that must survive, because a
      # record that refused them would be asserting a local-file-identifier
      # stability no property in an FBX can deliver.
      - run: tools/unity-identity-file/scripts/check_file_record.sh

      # The §22B-1e3b wire grammar has two implementations on purpose: the
      # writer's, and the independent one the outside join uses. This gate is
      # what keeps the second one able to tell a wrong file from a right one —
      # one transcript that must be accepted and one per defect that must be
      # refused by name. It needs no editor, no kernel and no compiler.
      - run: tools/fbx-identity/scripts/check_join.py

      # One crate owns the sketch solver boundary. Both halves keep compiling
      # if a second copy appears, so this is checked rather than remembered.
      - run: tools/check-solver-ownership.sh
      # GitHub limits each run script; actionlint alone does not check this.
      - run: python3 tools/check-actions-run-size.py

      # And one file owns planegcs's native build inputs. A second copy of a
      # version or a digest, or a Boost taken from a package manager, keeps
      # every workflow green while making the release input a property of a
      # runner image, so it is checked here rather than in the workflow that
      # would inherit it.
      - run: tools/check-planegcs-pins.sh

      # And one file owns the notice generator's identity and the roots the
      # notices are taken from. This needs no toolchain and no network, so it
      # rides along here rather than waiting for the job that runs the
      # generator.
      - run: tools/check-notice-ownership.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three are product targets. macOS is not a courtesy build: a
        # failure here blocks the merge exactly as the others do.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the Apple Silicon macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo '::error::macOS requires native Apple Silicon'; exit 1; }
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin || {
            echo '::error::macOS requires the aarch64-apple-darwin Rust host'; exit 1;
          }

      - uses: Swatinem/rust-cache@v2
      - name: Check macOS architecture refusals
        if: runner.os == 'macOS'
        run: bash tools/check-macos-architecture.sh
      - run: cargo build --workspace --all-targets

      # A passive trap, armed before the tests and touching nothing about how
      # they run. Windows has twice killed a test process with
      # STATUS_ACCESS_VIOLATION and no Rust panic, and a rerun passed both
      # times, so the evidence disappeared with the process. Four probe rounds
      # failed to reproduce it on demand, so the next natural occurrence is the
      # next chance to see a stack. This only asks Windows to write a dump if a
      # process dies; it does not retry, skip, serialise or reconfigure
      # anything.
      - name: Arm Windows crash dumps
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'crashdumps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dir -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord
          # 2 is a full dump, which is what makes a stack readable afterwards.
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord

      # Includes real CLI create processes, the UI New command and cancellation/
      # accepted-scene gates. The build above supplies both client executables.
      - run: cargo test --workspace

      - name: Discover constraint editing and preserve drafts without native geometry
        shell: bash
        run: |
          set -euo pipefail
          for gate in constraint_discovery_requests_and_delivery_without_native constraint_discovery_separates_document_and_feature_refusals constraint_os_paths_and_flag_shaped_arguments; do
            cargo test -p ferritecad-cli --test edit_constraints "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee "$gate.log"
            if grep -q 'skipped:' "$gate.log" || ! grep -Fq "test $gate ... ok" "$gate.log"; then exit 1; fi
          done
          for gate in constraints::tests::constraint_widgets_keep_draft_on_save_cancel_refusal_and_stale_reply constraints::tests::line_length_widgets_validate_input_without_changing_history_until_apply constraints::tests::replace_line_length_widgets_build_one_remove_add_request constraints::tests::fixed_point_widgets_pick_an_endpoint_and_replace_the_stored_pin_in_one_step constraints::tests::equal_length_widgets_pick_two_lines_and_name_the_persisted_pair constraints::tests::line_relation_widgets_pick_two_lines_and_name_the_persisted_relation constraints::tests::constraint_editor_keeps_actions_reachable_with_many_pending_additions; do
            cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee constraints-draft.log
            if grep -q 'skipped:' constraints-draft.log || ! grep -Fq "test $gate ... ok" constraints-draft.log; then exit 1; fi
          done
          for gate in a_fixed_endpoint_is_checked_replaced_and_removed_without_touching_other_ids several_pins_or_an_unrepresentable_pin_refuse_the_whole_document equal_length_pairs_are_checked_stored_and_removed_without_touching_other_ids line_relations_are_checked_stored_and_removed_without_touching_other_ids; do
            cargo test -p ferritecad-document --test constraint_edit "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee "$gate.log"
            if grep -q 'skipped:' "$gate.log" || ! grep -Fq "test $gate ... ok" "$gate.log"; then exit 1; fi
          done

      - name: Discover Revolve profile constraints without native geometry
        shell: bash
        run: |
          set -euo pipefail
          gate=constraints::revolve_constraint_discovery_writer_and_refusals_without_solver
          cargo test -p ferritecad-cli --test revolve "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-constraints-discovery.log
          if grep -q 'skipped:' revolve-constraints-discovery.log || ! grep -Fq "test $gate ... ok" revolve-constraints-discovery.log; then exit 1; fi
          gate=constraints::tests::revolve::revolve_constraint_widgets_name_the_revolve_build_and_replace_a_length
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-constraints-widgets.log
          if grep -q 'skipped:' revolve-constraints-widgets.log || ! grep -Fq "test $gate ... ok" revolve-constraints-widgets.log; then exit 1; fi
          # §27H: the same for a solid profile closed on the axis.
          gate=axis_constraints::axis_closed_constraint_discovery_writer_and_refusals_without_solver
          cargo test -p ferritecad-cli --test revolve "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee axis-constraints-discovery.log
          if grep -q 'skipped:' axis-constraints-discovery.log || ! grep -Fq "test $gate ... ok" axis-constraints-discovery.log; then exit 1; fi
          gate=constraints::tests::revolve::axis_closed_constraint_widgets_name_the_axis_line_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee axis-constraints-widgets.log
          if grep -q 'skipped:' axis-constraints-widgets.log || ! grep -Fq "test $gate ... ok" axis-constraints-widgets.log; then exit 1; fi

      - name: Discover single-edge fillets without native geometry
        shell: bash
        run: |
          set -euo pipefail
          for gate in fillet_discovery_and_protocol_without_native \
            fillet_discovery_refuses_every_composition_outside_the_class_without_native
          do
            cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-discovery.log
            if grep -q 'skipped:' fillet-discovery.log || ! grep -Fq "test $gate ... ok" fillet-discovery.log; then exit 1; fi
          done
          gate=fillets::tests::fillet_widgets_list_corners_refuse_like_the_document_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-widgets.log
          if grep -q 'skipped:' fillet-widgets.log || ! grep -Fq "test $gate ... ok" fillet-widgets.log; then exit 1; fi
          for gate in fillet::tests::one_fillet_is_written_as_the_new_tip_and_a_forged_one_is_refused \
            fillet::tests::corners_are_the_four_joints_whatever_the_winding_or_starting_segment
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-writer.log
            if grep -q 'skipped:' fillet-writer.log || ! grep -Fq "test $gate ... ok" fillet-writer.log; then exit 1; fi
          done
          # The public recipe against a build with no kernel: discovery works,
          # geometry is refused typed, and it says so.
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/single-edge-fillet.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28A_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28a-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28a-recipe.py | tee fillet-recipe-stub.log
          grep -q '^FCAD_28A_RECIPE_NO_KERNEL ' fillet-recipe-stub.log

      - name: Discover and refuse Fillet radius edits without native geometry
        shell: bash
        run: |
          set -euo pipefail
          gate=radius::radius_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-radius-discovery.log
          if grep -q 'skipped:' fillet-radius-discovery.log || ! grep -Fq "test $gate ... ok" fillet-radius-discovery.log; then exit 1; fi
          gate=fillets::tests::fillet_radius_widgets_show_the_saved_edge_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-radius-widgets.log
          if grep -q 'skipped:' fillet-radius-widgets.log || ! grep -Fq "test $gate ... ok" fillet-radius-widgets.log; then exit 1; fi
          for gate in fillet_radius::tests::only_the_radius_changes_and_repeated_or_equal_edits_keep_every_identity \
            fillet_radius::tests::the_writer_refuses_a_forged_or_stale_preparation \
            fillet_radius::tests::a_fillet_outside_the_frame_is_refused_with_its_reason
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-radius-writer.log
            if grep -q 'skipped:' fillet-radius-writer.log || ! grep -Fq "test $gate ... ok" fillet-radius-writer.log; then exit 1; fi
          done
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-radius.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28B_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28b-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28b-recipe.py | tee fillet-radius-recipe-stub.log
          grep -q '^FCAD_28B_RECIPE_NO_KERNEL ' fillet-radius-recipe-stub.log

      - name: Discover and refuse rounded-plate height edits without native geometry
        shell: bash
        run: |
          set -euo pipefail
          gate=height::height_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-height-discovery.log
          if grep -q 'skipped:' fillet-height-discovery.log || ! grep -Fq "test $gate ... ok" fillet-height-discovery.log; then exit 1; fi
          gate=edits::tests::fillet_base_height_widgets_show_the_fillet_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-height-widgets.log
          if grep -q 'skipped:' fillet-height-widgets.log || ! grep -Fq "test $gate ... ok" fillet-height-widgets.log; then exit 1; fi
          for gate in fillet_radius::tests::the_base_height_changes_alone_and_interleaves_with_the_radius \
            fillet_radius::tests::the_height_writer_refuses_a_forged_or_stale_preparation \
            fillet_radius::tests::a_height_under_a_fillet_outside_the_frame_is_refused_with_its_reason
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-height-writer.log
            if grep -q 'skipped:' fillet-height-writer.log || ! grep -Fq "test $gate ... ok" fillet-height-writer.log; then exit 1; fi
          done
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-base-height.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28C_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28c-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28c-recipe.py | tee fillet-height-recipe-stub.log
          grep -q '^FCAD_28C_RECIPE_NO_KERNEL ' fillet-height-recipe-stub.log

      - name: Discover and refuse rounded-plate Sketch edits without native geometry
        shell: bash
        run: |
          set -euo pipefail
          gate=sketch::sketch_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-sketch-discovery.log
          if grep -q 'skipped:' fillet-sketch-discovery.log || ! grep -Fq "test $gate ... ok" fillet-sketch-discovery.log; then exit 1; fi
          gate=sketch::tests::fillet_base_sketch_widgets_show_the_corner_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-sketch-widgets.log
          if grep -q 'skipped:' fillet-sketch-widgets.log || ! grep -Fq "test $gate ... ok" fillet-sketch-widgets.log; then exit 1; fi
          for gate in fillet_radius::tests::the_base_rectangle_moves_and_resizes_alone_and_interleaves \
            fillet_radius::tests::a_candidate_rectangle_that_does_not_keep_the_rounded_corner_is_refused \
            fillet_radius::tests::the_sketch_writer_refuses_a_forged_or_stale_preparation \
            fillet_radius::tests::a_sketch_under_a_fillet_outside_the_frame_is_refused_with_its_reason
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-sketch-writer.log
            if grep -q 'skipped:' fillet-sketch-writer.log || ! grep -Fq "test $gate ... ok" fillet-sketch-writer.log; then exit 1; fi
          done
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-base-sketch.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28D_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28d-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28d-recipe.py | tee fillet-sketch-recipe-stub.log
          grep -q '^FCAD_28D_RECIPE_NO_KERNEL ' fillet-sketch-recipe-stub.log

      - name: Discover and refuse rounded-plate constraint edits without native geometry
        shell: bash
        run: |
          set -euo pipefail
          gate=constraints::constraint_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-constraints-discovery.log
          if grep -q 'skipped:' fillet-constraints-discovery.log || ! grep -Fq "test $gate ... ok" fillet-constraints-discovery.log; then exit 1; fi
          gate=constraints::tests::fillet_base_constraint_widgets_name_the_fillet_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-constraints-widgets.log
          if grep -q 'skipped:' fillet-constraints-widgets.log || ! grep -Fq "test $gate ... ok" fillet-constraints-widgets.log; then exit 1; fi
          for gate in fillet_radius::tests::constraints_on_the_rounded_plate_change_only_the_sketch_and_defer_the_bound \
            fillet_radius::tests::the_constraint_writer_rederives_the_edit_under_a_fillet \
            fillet_radius::tests::the_evaluator_judges_the_fillet_on_the_built_lines
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-constraints-writer.log
            if grep -q 'skipped:' fillet-constraints-writer.log || ! grep -Fq "test $gate ... ok" fillet-constraints-writer.log; then exit 1; fi
          done
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/fillet-base-constraints.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28E_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28e-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28e-recipe.py | tee fillet-constraints-recipe-stub.log
          grep -q '^FCAD_28E_RECIPE_NO_KERNEL ' fillet-constraints-recipe-stub.log

      - name: Discover and refuse rounding a dimensioned plate without native geometry
        shell: bash
        run: |
          set -euo pipefail
          # §28F: the candidates of a dimensioned plate are structural and
          # say their numbers are stored; nothing is solved or built here.
          gate=constraints::first::rounding_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-first-discovery.log
          if grep -q 'skipped:' fillet-first-discovery.log || ! grep -Fq "test $gate ... ok" fillet-first-discovery.log; then exit 1; fi
          gate=fillets::tests::fillet_widgets_on_a_dimensioned_plate_label_stored_numbers_and_defer_the_bound
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-first-widgets.log
          if grep -q 'skipped:' fillet-first-widgets.log || ! grep -Fq "test $gate ... ok" fillet-first-widgets.log; then exit 1; fi
          gate=fillet::tests::a_dimensioned_plate_is_a_target_judged_by_value_until_it_is_solved
          cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-first-writer.log
          if grep -q 'skipped:' fillet-first-writer.log || ! grep -Fq "test $gate ... ok" fillet-first-writer.log; then exit 1; fi
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/fillet-constrained-plate.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28F_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28f-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$PWD/target/debug/ferritecad" python3 ferrite-28f-recipe.py | tee fillet-first-recipe-stub.log
          grep -q '^FCAD_28F_RECIPE_NO_KERNEL ' fillet-first-recipe-stub.log

      - name: Discover and refuse a second Fillet without native geometry
        shell: bash
        run: |
          set -euo pipefail
          # §28G: the three other corners of a rounded plate, the same corner
          # and a third Fillet refused, and a writer that re-derives the
          # second Fillet; nothing is built here.
          gate=sequential::sequential_discovery_and_protocol_without_native
          cargo test -p ferritecad-cli --test fillet "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-second-discovery.log
          if grep -q 'skipped:' fillet-second-discovery.log || ! grep -Fq "test $gate ... ok" fillet-second-discovery.log; then exit 1; fi
          gate=fillets::tests::second_fillet_widgets_show_the_history_and_keep_the_draft
          cargo test -p ferritecad-app "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-second-widgets.log
          if grep -q 'skipped:' fillet-second-widgets.log || ! grep -Fq "test $gate ... ok" fillet-second-widgets.log; then exit 1; fi
          for gate in fillet::tests::a_second_fillet_is_written_on_the_first_and_a_third_is_offered \
            fillet::tests::the_validator_refuses_an_edge_outside_the_fillets_history
          do
            cargo test -p ferritecad-document --lib "$gate" -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-second-writer.log
            if grep -q 'skipped:' fillet-second-writer.log || ! grep -Fq "test $gate ... ok" fillet-second-writer.log; then exit 1; fi

            chamfer::tests::a_chamfer_is_written_at_every_corner_in_both_windings_and_reads_back \
            chamfer::tests::the_distance_edit_changes_one_number_and_the_writer_refuses_forgery \
            chamfer::tests::the_creation_writer_rederives_the_chamfer_and_refuses_forgery \
            chamfer::tests::every_other_editor_refuses_a_chamfered_body_by_name \
            chamfer::tests::a_dimensioned_plate_is_refused_with_the_constraint_named \
            chamfer::tests::the_evaluator_judges_the_chamfer_on_the_built_lines \
            chamfer::tests::the_height_of_a_chamfered_plate_changes_one_row_and_the_writer_refuses_forgery \
            chamfer::tests::the_height_edit_refuses_a_chamfer_outside_the_class_naming_the_feature \
            chamfer::tests::a_chamfered_plates_sketch_keeps_its_corner_and_distance_exactly \
            chamfer::tests::the_coordinate_writer_rederives_under_a_chamfer_and_refuses_forgery \
            chamfer::tests::a_constrained_plate_is_read_with_stored_facts_and_a_deferred_bound \
            chamfer::tests::the_evaluator_judges_a_constrained_plate_on_its_solved_lines \
            chamfer::tests::the_constraint_writer_rederives_under_a_chamfer_and_refuses_forgery
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release -p ferritecad-document --lib "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee chamfer-document.log
            if grep -q 'skipped:' chamfer-document.log || ! grep -Fq "test $gate ... " chamfer-document.log \
              || ! grep -q '^test result: ok\. 1 passed; 0 failed' chamfer-document.log; then exit 1; fi
          done
          for gate in map::tests::a_chamfer_is_named_by_its_edge_in_its_own_map_and_carries_only_what_its_history_says \
            codec::tests::an_edge_chamfer_face_survives_its_byte_form_and_is_not_a_fillet_face
          do

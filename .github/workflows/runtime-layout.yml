          echo "FCAD_ADD_FILLET_SESSION_FBX_DIR=$add_fillet_artifacts" >> "$GITHUB_ENV"

          add_chamfer_dir="$RUNNER_TEMP/add-chamfer-session"
          mkdir -p "$add_chamfer_dir"
          add_chamfer_artifacts="$add_chamfer_dir"
          case '${{ matrix.name }}' in

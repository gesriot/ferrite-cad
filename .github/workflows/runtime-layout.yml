          angle_dir="$RUNNER_TEMP/angle-session"
          mkdir -p "$angle_dir"
          angle_artifacts="$angle_dir"
          case '${{ matrix.name }}' in
            windows) angle_artifacts="$(cygpath -w "$angle_artifacts")" ;;
          esac
          export FCAD_ANGLE_SESSION_ARTIFACTS="$angle_artifacts"
          for gate in sessions::tests::angle::native_radial_profile_then_angle_is_one_session_like_cli \
            sessions::tests::angle::native_axis_closed_profile_then_angle_keeps_axis_and_caps \
            sessions::tests::angle::native_constraints_then_angle_preserve_stored_approximation_and_cli_cells
          do
            cargo test --release --features planegcs -p ferritecad-app --bin ferritecad-viewer "$gate" \

          grep -q '^FCAD_CHAMFER_SKETCH_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_CHAMFER_CONSTRAINTS_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_ANALYTIC_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_ANGLE_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_CUT_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_ADD_CUT_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_ADD_FILLET_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_ADD_CHAMFER_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_NEW_DOCUMENT_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_RECOVERY_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_FILLET_SESSION_UFBX_EXECUTED$' fbx-json-tests.log
          grep -q '^FCAD_CHAMFER_SESSION_UFBX_EXECUTED$' fbx-json-tests.log

      - name: Export one native Body through both STL clients
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          libs="$FCAD_OCCT_LIB_DIR:$PWD/vendor/planegcs"
          case '${{ matrix.name }}' in
            windows) export PATH="$libs:$PATH" ;;
            macos) export DYLD_LIBRARY_PATH="$libs"; export DYLD_FALLBACK_LIBRARY_PATH="$libs" ;;
            linux) export LD_LIBRARY_PATH="$libs" ;;
          esac
          cargo test --release --features planegcs -p ferritecad-app \
            --bin ferritecad-viewer exports::stl::tests::native_ -- --nocapture 2>&1 | tee stl-tests.log
          if grep -q 'skipped:' stl-tests.log; then
            echo "::error::a native STL gate skipped itself"
            exit 1
          fi
          for gate in \
            native_stl_ui_and_cli_choose_the_same_body_and_write_identical_bytes \
            native_stl_refusals_and_saved_source_changes_are_honest \
            native_stl_owned_workers_keep_publication_and_stale_answers_honest \
            native_stl_dialog_choices_and_unavailable_documents_do_no_unrequested_work
          do
            if ! grep -q "^test exports::stl::tests::${gate} \.\.\. ok$" stl-tests.log; then
              echo "::error::${gate} did not execute and pass"
              exit 1
            fi
          done

      - name: Require the application to import both runtime component families
        run: |
          set -euo pipefail
          viewer='${{ steps.build.outputs.viewer }}'
          cli='${{ steps.build.outputs.cli }}'

          imports() {
            case '${{ matrix.name }}' in
              linux)   ldd "$1" > "$2" 2>&1 || true ;;
              macos)   otool -L "$1" > "$2" 2>&1 || true ;;
              windows) "$FCAD_MSVC_BIN/dumpbin.exe" //DEPENDENTS \
                         "$(cygpath -w "$1")" > "$2" 2>&1 || true ;;
            esac
            # Kept whole and printed. An inspector that failed and a binary
            # that names nothing look identical once the output is thrown away,
            # and the first of those is a broken gate rather than a finding.
            sed -n '1,20p' "$2"
            if [ ! -s "$2" ]; then
              echo "::error::the import table of $1 could not be read"
              exit 1
            fi
          }

          echo "== ferritecad-viewer"
          imports "$viewer" viewer-imports.txt
          grep -iq 'planegcs\.\(so\|dylib\|dll\)' viewer-imports.txt \
            || { echo "::error::the application does not import planegcs"; exit 1; }
          grep -iqE 'libTK|TK[A-Za-z0-9]*\.dll' viewer-imports.txt \
            || { echo "::error::the application does not import any Open CASCADE toolkit"; exit 1; }

          echo "== ferritecad"
          imports "$cli" cli-imports.txt
          grep -iqE 'libTK|TK[A-Za-z0-9]*\.dll' cli-imports.txt \
            || { echo "::error::the command line tool does not import Open CASCADE"; exit 1; }

          echo "the application imports planegcs and Open CASCADE; the command line tool"
          echo "imports Open CASCADE"

      # ---------------------------------------------------------------------
      # The measurement.
      # ---------------------------------------------------------------------

      - name: Measure the runtime closure of both product binaries
        run: |
          set -euo pipefail
          for pair in 'viewer:${{ steps.build.outputs.viewer }}' \
                      'cli:${{ steps.build.outputs.cli }}'; do
            label="${pair%%:*}"
            binary="${pair#*:}"
            tools/runtime-closure.sh --platform '${{ matrix.name }}' --label "$label" \
              --binary "$binary" \
              --search '${{ steps.occt.outputs.lib_dir }}' \
              --search "$PWD/vendor/planegcs" \
              --output "closure-${label}.txt"
          done

      - name: Refuse a closure with anything nobody has accounted for in it
        run: |
          set -euo pipefail
          # The stop conditions of §21A-2b2a, asked of the measurement rather
          # than of anyone's memory. An unknown non-system library is a licence
          # question and a packaging question at once; Qt or a FreeCAD runtime
          # would mean the sketch solver had dragged an application framework in
          # behind it.
          if grep -h '^dep .* unexpected ' closure-*.txt; then
            echo "::error::the runtime closure holds libraries nobody has accounted for"
            exit 1
          fi
          if grep -hiE '^dep .*(libQt|Qt[0-9]|libFreeCAD|FreeCAD.*\.(so|dylib|dll))' closure-*.txt; then
            echo "::error::the closure carries a Qt or FreeCAD runtime dependency"
            exit 1
          fi

          # And that it is a measurement at all. A report with no Open CASCADE
          # in it, or no planegcs, is one of the two proofs that already
          # existed rather than the one this workflow is for.
          grep -q '^dep viewer .* planegcs ' closure-viewer.txt \
            || { echo "::error::the application closure carries no planegcs"; exit 1; }
          grep -q '^dep viewer .* occt ' closure-viewer.txt \
            || { echo "::error::the application closure carries no Open CASCADE"; exit 1; }
          grep -q '^dep cli .* occt ' closure-cli.txt \
            || { echo "::error::the command line closure carries no Open CASCADE"; exit 1; }

          echo "--- what the two binaries need ---"
          grep -h '^total ' closure-*.txt

      # ---------------------------------------------------------------------
      # The candidate layout, and running it with everything taken away.
      # ---------------------------------------------------------------------

      - name: Stage the candidate relocatable layout
        id: stage
        run: |
          set -euo pipefail
          # Into the runner's temporary directory, and named as what it is.
          # Nothing here is a release: no version, no archive, no signature
          # anyone should rely on, and it is deleted with the runner.
          staging="${RUNNER_TEMP}/ferritecad-layout"

          # The version and the application, from the document that owns both.
          # The packager already reads the version out of the same file, and a
          # stager that worked either of them out for itself would be a second
          # opinion about which release this is and which of the two staged
          # executables a desktop should start.
          version="$(jq -r '.productVersion' sbom/native/native-assets-inventory.json | tr -d '\r')"
          gui="$(jq -r '.productRoots[] | select(.package == "ferritecad-app") | .binary' \
            sbom/native/native-assets-inventory.json | tr -d '\r')"
          [ -n "$version" ] && [ "$version" != null ] \
            || { echo "::error::the inventory does not say what version the product is"; exit 1; }
          [ "$(printf '%s\n' "$gui" | wc -l | tr -d ' ')" = 1 ] && [ -n "$gui" ] \
            || { echo "::error::the inventory does not name one product root built from ferritecad-app"; exit 1; }

          tools/stage-runtime-layout.sh --platform '${{ matrix.name }}' \
            --staging "$staging" \
            --occt-lib-dir '${{ steps.occt.outputs.lib_dir }}' \
            --planegcs-dir "$PWD/vendor/planegcs" \
            --product-version "$version" \
            --gui-executable "$gui" \
            --closure closure-viewer.txt --closure closure-cli.txt \
            --executable '${{ steps.build.outputs.viewer }}' \
            --executable '${{ steps.build.outputs.cli }}' \
            | tee layout-${{ matrix.name }}.txt
          echo "staging=$staging" >> "$GITHUB_OUTPUT"

      - name: Take the build trees away and start the package
        env:
          FCAD_STAGING: ${{ steps.stage.outputs.staging }}
        run: |
          set -euo pipefail
          occt_libs='${{ steps.occt.outputs.lib_dir }}'
          occt_install="$PWD/vendor/install"
          planegcs="$PWD/vendor/planegcs"

          # A copy of a committed fixture, so the rebuild has a real document to
          # cross the Open CASCADE boundary with and the committed one cannot be
          # what changes.
          document="${RUNNER_TEMP}/plate.fcad"
          cp crates/ferritecad-fixtures/plate/plate.fcad "$document"

          # Renamed rather than deleted: a run that fails should leave the
          # evidence where it can be looked at, and the step that follows puts
          # them back.
          mv "$occt_install" "${occt_install}.away"
          mv "$planegcs" "${planegcs}.away"

          # Windows has no run path, so PATH is the loader's search list and
          # emptying the environment means emptying that. Everything the shell
          # itself needs stays; the build directories do not.
          filtered="$PATH"
          if [ '${{ matrix.name }}' = windows ]; then
            filtered="$(printf '%s' "$PATH" | tr ':' '\n' \
              | grep -v -F "$(cygpath -u "$occt_libs")" \
              | grep -v -F 'vendor/planegcs' | paste -sd: -)"
          fi

          status=0
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            PATH="$filtered" \
            tools/check-staged-layout.sh --platform '${{ matrix.name }}' \
              --staging "$FCAD_STAGING" --document "$document" \
              --forbidden "$occt_install" --forbidden "$planegcs" \
              --forbidden "$occt_libs" \
              --output "staged-facts-${{ matrix.name }}.txt" || status=$?

          mv "${occt_install}.away" "$occt_install"
          mv "${planegcs}.away" "$planegcs"

          if [ "$status" -ne 0 ]; then
            echo "::error::the staged layout did not run from a clean environment"
            exit "$status"
          fi

      # ---------------------------------------------------------------------
      # The native/assets inventory, against the layout that was just staged.
      # ---------------------------------------------------------------------

      - name: Require one owner for every staged file and every embedded asset
        run: |
          set -euo pipefail
          # The staged layout is still where the step above left it, and both
          # product binaries are still in the build tree. This is the only
          # place either exists, which is why the file boundary is checked
          # here rather than in a job that only has the repository.
          tools/check-native-inventory.sh \
            --platform '${{ matrix.name }}' \
            --staging '${{ steps.stage.outputs.staging }}' \
            --closure closure-viewer.txt --closure closure-cli.txt \
            --binary "ferritecad-viewer:${{ steps.build.outputs.viewer }}" \
            --binary "ferritecad:${{ steps.build.outputs.cli }}" \
            | tee "native-inventory-${{ matrix.name }}.txt"

      - name: Record what this build produced, which the inventory does not
        run: |
          set -euo pipefail
          . tools/native/lib.sh
          # Build-local evidence and nothing else. These digests are a property
          # of this run: two clean builds of the same target on one host
          # reproduce them, and the same pinned sources on another host do not
          # - measured on macOS, where every staged library differs in size
          # between a developer machine and this runner while every staged name
          # is identical. That is why the committed inventory carries source
          # pins and expected filenames and no build hash at all, and why the
          # packager will attach these to one build rather than to a component.
          staging='${{ steps.stage.outputs.staging }}'
          {
            echo "# build-local evidence, ${{ matrix.name }}; not a committed fact"
            echo "runner ${{ matrix.os }} ${RUNNER_ARCH}"
            find "$staging" -type f | LC_ALL=C sort | while IFS= read -r file; do
              # The shared helper reads the file on stdin. Naming a Windows
              # path makes GNU sha256sum escape the line and put a stray `\`
              # in front of the digest.
              digest="$(native_sha256 "$file")"
              printf 'staged %s %s %s\n' "${file#"$staging"/}" "$digest" \
                "$(wc -c < "$file" | tr -d ' ')"
            done
            # What the loader showed and the package deliberately does not
            # carry. Uploaded rather than committed: the set is a property of
            # the runner image, and a committed list would go stale on the next
            # one while looking like a statement about the product.
            awk '$1 == "dep" && $4 == "system" { print "system " $5 }' \
              closure-viewer.txt closure-cli.txt | LC_ALL=C sort -u
          } > "native-evidence-${{ matrix.name }}.txt"
          wc -l < "native-evidence-${{ matrix.name }}.txt"

      - name: Reproduce the native inventory on this host
        run: |
          set -euo pipefail
          generated="native-assets-inventory-${{ matrix.name }}.json"
          tools/generate-native-inventory.sh --output "$generated"
          if ! cmp -s sbom/native/native-assets-inventory.json "$generated"; then
            echo "::error::${{ matrix.name }} generated native inventory bytes that differ from the committed document"
            diff -u sbom/native/native-assets-inventory.json "$generated" \
              | head -n 80 || true
            exit 1
          fi
          echo "${{ matrix.name }} reproduced the committed native inventory byte for byte"

      - name: Keep the part of the inventory that must not differ between hosts
        run: |
          set -euo pipefail
          inventory="native-assets-inventory-${{ matrix.name }}.json"
          # Everything here is target-independent by construction: component
          # identities, their versions, their source digests, the asset digests,
          # which binary loads what, and the digest of the inventory document
          # itself. The three platforms have to produce identical files. The
          # per-target staged lists are deliberately absent - they differ, they
          # are checked against the real staging in the step above, and putting
          # them here would turn a real comparison into three files that only
          # agree about their own platform.
          {
            jq -r '.components[]
                   | "component " + .id + " " + .role + " "
                     + ((.source.sha256 // .asset.sha256) // "-")' \
              "$inventory"
            jq -r '.components[] | select(.role == "runtime-native")
                   | "loaded-by " + .id + " " + (.loadedBy | join(","))' \
              "$inventory"
            jq -r '.components[] | select(.role == "embedded-asset")
                   | "embedded-in " + .id + " " + (.embeddedIn | join(","))' \
              "$inventory"
            jq -r '.productRoots[] | "root " + .binary + " " + .rustFragmentRef' \
              "$inventory"
            jq -r '.rustFragments[] | "fragment " + .target + " " + .sha256' \
              "$inventory"
            case '${{ matrix.name }}' in
              macos) digest="$(shasum -a 256 "$inventory" | cut -d' ' -f1)" ;;
              *)     digest="$(sha256sum "$inventory" | cut -d' ' -f1)" ;;
            esac
            echo "inventory $digest"
          } | tr -d '\r' | LC_ALL=C sort > "native-stable-${{ matrix.name }}.txt"
          cat "native-stable-${{ matrix.name }}.txt"

      # ---------------------------------------------------------------------
      # The release archive. Everything above measured a staging directory;
      # this turns it into something that can be handed to somebody.
      # ---------------------------------------------------------------------

      - name: Pack the release archive, twice
        id: package
        run: |
          set -euo pipefail
          # Two packings of the same input bytes, into two directories, so the
          # claim that the archive depends only on the bytes is measured rather
          # than asserted. Only same-host: the native binaries are already
          # measured to differ between hosts, so an archive digest shared
          # across platforms would be a claim this repository knows is false.
          first="${RUNNER_TEMP}/package-first"
          second="${RUNNER_TEMP}/package-second"
          rm -rf "$first" "$second"
          # Which commit this is, handed in rather than worked out. GITHUB_SHA is
          # the commit this job checked out and built, and it is the only thing
          # here that knows it: the packager refuses to guess, because a
          # packager that ran `git rev-parse HEAD` would name whatever tree it
          # was standing in. Without it three archives of one version are
          # indistinguishable from three archives of three commits.
          tools/package-release.sh --platform '${{ matrix.name }}' \
            --staging '${{ steps.stage.outputs.staging }}' --output-dir "$first" \
            --source-revision "$GITHUB_SHA" \
            | tee "package-${{ matrix.name }}.txt"
          tools/package-release.sh --platform '${{ matrix.name }}' \
            --staging '${{ steps.stage.outputs.staging }}' --output-dir "$second" \
            --source-revision "$GITHUB_SHA" \
            > /dev/null

          archive="$(find "$first" -maxdepth 1 -name '*.tar.gz' | head -1)"
          if [ -z "$archive" ]; then
            echo "::error::the packager produced no archive"
            exit 1
          fi
          name="$(basename "$archive")"
          if ! cmp -s "$first/$name" "$second/$name"; then
            echo "::error::two packings of the same staged bytes produced different archives"
            ls -l "$first/$name" "$second/$name"
            exit 1
          fi
          echo "two packings of ${name} are byte-identical"

          # Copied into the workspace for the upload. Every other artifact in
          # this workflow is uploaded by a path relative to the checkout, and
          # RUNNER_TEMP on Windows is an absolute path with backslashes and a
          # drive letter in it; one spelling on all three platforms is one
          # fewer thing that can behave differently on one of them.
          cp "$first/$name" "./$name"
          cmp "$first/$name" "./$name"

          {
            echo "archive=$first/$name"
            echo "archive_name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Take the staging away as well, and run the extracted archive
        run: |
          set -euo pipefail
          occt_libs='${{ steps.occt.outputs.lib_dir }}'
          occt_install="$PWD/vendor/install"
          planegcs="$PWD/vendor/planegcs"
          staging='${{ steps.stage.outputs.staging }}'

          document="${RUNNER_TEMP}/plate-package.fcad"
          cp crates/ferritecad-fixtures/plate/plate.fcad "$document"

          # The staging directory goes away too, and that is the whole
          # difference between this gate and the one above it. A package that
          # only runs while the directory it was made from is still there is a
          # package nobody can be given.
          mv "$occt_install" "${occt_install}.away"
          mv "$planegcs" "${planegcs}.away"
          mv "$staging" "${staging}.away"

          filtered="$PATH"
          if [ '${{ matrix.name }}' = windows ]; then
            filtered="$(printf '%s' "$PATH" | tr ':' '\n' \
              | grep -v -F "$(cygpath -u "$occt_libs")" \
              | grep -v -F 'vendor/planegcs' | paste -sd: -)"
          fi

          status=0
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            PATH="$filtered" \
            tools/check-release-package.sh --platform '${{ matrix.name }}' \
              --archive '${{ steps.package.outputs.archive }}' \
              --extract-to "${RUNNER_TEMP}/extracted" \
              --document "$document" \
              --forbidden "$occt_install" --forbidden "$planegcs" \
              --forbidden "$occt_libs" --forbidden "$staging" \
              --output "package-facts-${{ matrix.name }}.txt" || status=$?

          mv "${occt_install}.away" "$occt_install"
          mv "${planegcs}.away" "$planegcs"

          if [ "$status" -ne 0 ]; then
            echo "::error::the extracted release archive did not run from a clean environment"
            exit "$status"
          fi

      - name: Say what this build packaged
        run: |
          set -euo pipefail
          # The gate above already refused an archive with more than one
          # top-level directory, so there is exactly one here. Spelled the way
          # the shell's own tools can read it: RUNNER_TEMP on Windows carries
          # backslashes and a drive letter.
          extracted="${RUNNER_TEMP}/extracted"
          if command -v cygpath >/dev/null 2>&1; then
            extracted="$(cygpath -u "$extracted")"
          fi
          root_dir="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d)"
          manifest="$root_dir/package/ferritecad-package.json"

          # jq on Windows is a native binary that opens stdout in text mode and
          # writes CRLF. A carriage return survives command substitution, and
          # every value read here is compared or diffed later, so it is taken
          # off once, here. The notices, the Rust fragment and the native
          # inventory were each bitten by this first.
          say() { jq -r "$1" "$manifest" | tr -d '\r'; }
          archive='${{ steps.package.outputs.archive }}'
          # Fed on stdin rather than named. GNU sha256sum escapes a line whose
          # file name contains a backslash by putting one at the front of it,
          # and RUNNER_TEMP on Windows is D:\a\_temp - so naming the file puts
          # a stray backslash in front of the digest. With nothing to name,
          # there is nothing to escape.
          case '${{ matrix.name }}' in
            macos) digest="$(shasum -a 256 < "$archive" | cut -d' ' -f1)" ;;
            *)     digest="$(sha256sum < "$archive" | cut -d' ' -f1)" ;;
          esac
          {
            echo "# FerriteCAD release archive, ${{ matrix.name }}; build-local evidence"
            echo "runner ${{ matrix.os }} ${RUNNER_ARCH}"
            echo "version $(say '.productVersion')"
            echo "source-revision $(say '.sourceRevision')"
            echo "target $(say '.target')"
            echo "root $(say '.root')"
            echo "archive ${{ steps.package.outputs.archive_name }}"
            echo "runtime-files $(say '.totals.runtimeFiles')"
            echo "payload-bytes $(say '.totals.runtimeBytes + .totals.packageMetadataBytes')"
            echo "sbom-sha256 $(say '.productSbom.sha256')"
            echo "archive-sha256 ${digest}"
            echo "archive-bytes $(wc -c < "$archive" | tr -d ' ')"
          } > "package-evidence-${{ matrix.name }}.txt"
          cat "package-evidence-${{ matrix.name }}.txt"

          # What the three platforms are compared on. Meaning only: the file
          # names differ per target, the native bytes are already measured to
          # be host-dependent, and an archive digest is a property of one host.
          # Comparing either would be comparing something this repository knows
          # cannot agree.
          {
            printf 'package %s version=%s\n' '${{ matrix.name }}' "$(say '.productVersion')"
            printf 'package %s source-revision=%s\n' '${{ matrix.name }}' "$(say '.sourceRevision')"
            printf 'package %s target=%s\n' '${{ matrix.name }}' "$(say '.target')"
            printf 'package %s archive=%s\n' '${{ matrix.name }}' '${{ steps.package.outputs.archive_name }}'
            printf 'package %s runtime-files=%s\n' '${{ matrix.name }}' "$(say '.totals.runtimeFiles')"
            printf 'package %s manifest-format=%s\n' '${{ matrix.name }}' "$(say '.formatVersion')"
            sed 's/^/packaged /' "package-facts-${{ matrix.name }}.txt"
          } | LC_ALL=C sort > "package-summary-${{ matrix.name }}.txt"
          cat "package-summary-${{ matrix.name }}.txt"

      - name: Upload the release archive
        uses: actions/upload-artifact@v4
        with:
          name: ferritecad-release-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

      - name: Upload what this build packaged
        # Uploaded even when the job failed, which is when the facts are most
        # worth reading: they say how far the extracted package got. The
        # comparison below requires all three summaries by name, so a run that
        # produced none cannot pass by having uploaded nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-summary-${{ matrix.name }}
          path: |
            package-summary-${{ matrix.name }}.txt
            package-evidence-${{ matrix.name }}.txt
            package-facts-${{ matrix.name }}.txt
            package-${{ matrix.name }}.txt
          if-no-files-found: warn

      - name: Write the measurement report
        run: |
          set -euo pipefail
          {
            echo "combined runtime layout, ${{ matrix.name }}"
            echo
            echo "runner        ${{ matrix.os }} / ${RUNNER_ARCH}"
            echo "rustc         $(rustc --version)"
            echo "occt commit   ${OCCT_COMMIT}"
            echo "occt cache    ${{ steps.occt-cache.outputs.cache-hit == 'true' && 'reused' || 'built in this run' }}"
            echo
            cat vendor/planegcs/PROVENANCE.txt
            echo
            cat layout-${{ matrix.name }}.txt
            echo
            cat closure-viewer.txt
            echo
            cat closure-cli.txt
          } > "runtime-layout-${{ matrix.name }}.txt"
          cat "runtime-layout-${{ matrix.name }}.txt"

      - name: Keep the summary for the platforms to be compared on
        run: |
          set -euo pipefail
          # Meaning, not sizes. The three platforms carry different libraries
          # under different names and cannot be diffed against each other; what
          # they must agree about is that the combined build happened, that
          # both families are in the closure, that nothing unaccounted for is,
          # and that the package started with the build trees gone.
          {
            awk -v p='${{ matrix.name }}' '
                $1 == "dep" && $4 == "planegcs" { planegcs++ }
                $1 == "dep" && $4 == "occt" { occt++ }
                END {
                    printf "combined %s viewer-imports-planegcs=%d\n", p, planegcs + 0
                    printf "combined %s viewer-imports-occt=%d\n", p, occt + 0
                }' closure-viewer.txt
            awk -v p='${{ matrix.name }}' '
                $1 == "dep" && $4 == "occt" { occt++ }
                END { printf "combined %s cli-imports-occt=%d\n", p, occt + 0 }' closure-cli.txt
            awk -v p='${{ matrix.name }}' '
                $1 == "dep" && $4 == "unexpected" { n++ }
                END { printf "combined %s unexpected=%d\n", p, n + 0 }' \
                closure-viewer.txt closure-cli.txt
            sed 's/^/staged /' "staged-facts-${{ matrix.name }}.txt"
          } | LC_ALL=C sort > "summary-${{ matrix.name }}.txt"
          cat "summary-${{ matrix.name }}.txt"

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-layout-${{ matrix.name }}
          path: |
            runtime-layout-${{ matrix.name }}.txt
            edit-tests.log
            fbx-json-tests.log
            import-tests.log
            json-import-tests.log
            closure-viewer.txt
            closure-cli.txt
            layout-${{ matrix.name }}.txt
            staged-facts-${{ matrix.name }}.txt
            native-inventory-${{ matrix.name }}.txt
            native-evidence-${{ matrix.name }}.txt
            native-assets-inventory-${{ matrix.name }}.json
          # Uploaded even when the job failed, which is when the closure and
          # the layout are most worth reading. A run that stopped before
          # producing them must not have its real failure replaced by an
          # upload that found nothing.
          if-no-files-found: warn

      - name: Upload the summary
        uses: actions/upload-artifact@v4
        with:
          name: runtime-layout-summary-${{ matrix.name }}
          path: summary-${{ matrix.name }}.txt
          if-no-files-found: error

      # Separate from the summary, because the comparison below asks a
      # different question of it: the summary is compared by meaning per
      # platform, and this has to be byte for byte the same file everywhere.
      - name: Upload the host-independent part of the inventory
        uses: actions/upload-artifact@v4
        with:
          name: native-inventory-stable-${{ matrix.name }}
          path: native-stable-${{ matrix.name }}.txt
          if-no-files-found: error

  compare:
    name: Compare what the three platforms measured
    needs: measure
    runs-on: ubuntu-latest
    steps:
      # The repository, because the release set checker hands every archive to
      # tools/check-release-package.sh, and that compares the product SBOM
      # inside the archive with the committed one. Checked out first: it is the
      # only step here that writes to the workspace root.
      - uses: actions/checkout@v7

      - name: Download every summary
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-layout-summary-*
          path: summaries

      - name: Require a combined measurement on all three platforms
        run: |
          set -euo pipefail
          count="$(find summaries -name 'summary-*.txt' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error::expected three platform summaries, found ${count}"
            find summaries -type f | sed 's/^/  /'
            exit 1
          fi

          # Named rather than counted. Three files agreeing about nothing in
          # particular is what a count buys; these are the facts the slice is
          # about, and every platform has to carry every one of them.
          missing=0
          for platform in linux macos windows; do
            summary="summaries/runtime-layout-summary-${platform}/summary-${platform}.txt"
            if [ ! -f "$summary" ]; then
              echo "::error::${platform} produced no summary, so the comparison has a hole in it"
              missing=$((missing + 1))
              continue
            fi
            echo "== ${platform}"
            cat "$summary"

            require() {
              if ! grep -q "$1" "$summary"; then
                echo "::error::${platform}: ${2}"
                missing=$((missing + 1))
              fi
            }
            # Both component families, on both product binaries. A summary
            # missing one of these is one of the two proofs that already
            # existed being reported as the new one.
            require '^combined .* viewer-imports-planegcs=[1-9]' \
              'the application closure carries no planegcs'
            require '^combined .* viewer-imports-occt=[1-9]' \
              'the application closure carries no Open CASCADE'
            require '^combined .* cli-imports-occt=[1-9]' \
              'the command line closure carries no Open CASCADE'
            require '^combined .* unexpected=0' \
              'the closure holds libraries nobody has accounted for'
            # And that the package really ran with the build trees gone.
            require '^staged clean-environment forbidden-directories-present=0' \
              'the build trees were still there when the package was started'
            require '^staged clean-environment staged-files-naming-build-tree=0' \
              'a staged file still names a directory that is gone'
            require '^staged staged viewer solver-info exit=0 answer=available' \
              'the staged application did not answer about its solver'
            require '^staged staged viewer provenance-from-staged-library=true' \
              'the staged application did not repeat the staged library'
            require '^staged staged cli rebuild-cold exit=0 kernel=occt' \
              'the staged command line tool did not cross the Open CASCADE boundary'
            require '^staged staged cli document-unchanged=true' \
              'the rebuild changed the document it was diagnosing'
            require '^staged staged viewer hidden-planegcs started=false' \
              'the staged application ran with planegcs taken away'
            require '^staged staged cli hidden-occt-toolkit started=false' \
              'the staged command line tool ran with a toolkit taken away'
            require '^staged staged both restored=true' \
              'the package was never shown to work again after the libraries came back'
            if [ "$platform" = macos ]; then
              require '^staged layout macos-bundle architecture=arm64-only' \
                'the staged macOS executable/dylib architectures were not verified'
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "all three platforms performed the combined build, measured both component"
          echo "families, found nothing unaccounted for, and started the staged layout with"
          echo "the build trees taken away"

      - name: Download every host-independent inventory
        uses: actions/download-artifact@v4
        with:
          pattern: native-inventory-stable-*
          path: inventories

      - name: Require the three hosts to have generated one inventory
        run: |
          set -euo pipefail
          # Named rather than counted, and named for all three: a platform that
          # dropped out of the matrix would otherwise leave two files that
          # agree perfectly with each other.
          missing=0
          for platform in linux macos windows; do
            file="inventories/native-inventory-stable-${platform}/native-stable-${platform}.txt"
            if [ ! -f "$file" ]; then
              echo "::error::${platform} produced no native inventory evidence"
              missing=$((missing + 1))
              continue
            fi
            if [ ! -s "$file" ]; then
              echo "::error::${platform} produced an empty native inventory evidence file"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Byte for byte. Everything in these files is target-independent by
          # construction - component identities, versions, source digests, asset
          # digests, which binary loads what, and the digest of the inventory
          # document itself - so a difference is either a host generating
          # different bytes or a component whose identity depends on where it
          # was generated. The Windows CRLF defect proved why this is a
          # comparison and not three separate assertions.
          reference="inventories/native-inventory-stable-linux/native-stable-linux.txt"
          differs=0
          for platform in macos windows; do
            file="inventories/native-inventory-stable-${platform}/native-stable-${platform}.txt"
            if ! diff -u "$reference" "$file" > "diff-${platform}.txt"; then
              echo "::error::${platform} and linux disagree about the host-independent part of the inventory"
              sed 's/^/  /' "diff-${platform}.txt"
              differs=$((differs + 1))
            fi
          done
          [ "$differs" -eq 0 ] || exit 1

          echo "--- what all three hosts generated ---"
          cat "$reference"
          echo
          echo "the three platforms agree about every component identity, every source"
          echo "digest, every asset digest, which binary loads which native component,"
          echo "and the bytes of the inventory document itself"

      # ---------------------------------------------------------------------
      # And that all three of them produced a release archive.
      # ---------------------------------------------------------------------

      - name: Download what each platform packaged
        uses: actions/download-artifact@v4
        with:
          pattern: package-summary-*
          path: packages

      - name: Require a release archive from all three platforms and all three targets
        run: |
          set -euo pipefail
          count="$(find packages -name 'package-summary-*.txt' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error::expected three platform package summaries, found ${count}"
            find packages -type f | sed 's/^/  /'
            exit 1
          fi

          # Named rather than counted, and the targets named as well. Three
          # summaries that all said x86_64-unknown-linux-gnu would satisfy a
          # count while meaning that two platforms had packaged somebody else's
          # product.
          missing=0
          : > targets.txt
          : > versions.txt
          : > revisions.txt
          for platform in linux macos windows; do
            summary="packages/package-summary-${platform}/package-summary-${platform}.txt"
            if [ ! -f "$summary" ]; then
              echo "::error::${platform} produced no package summary, so no archive was uploaded there"
              missing=$((missing + 1))
              continue
            fi
            echo "== ${platform}"
            cat "$summary"

            require() {
              if ! grep -q "$1" "$summary"; then
                echo "::error::${platform}: ${2}"
                missing=$((missing + 1))
              fi
            }
            # That an archive exists, that it was inspected before it was
            # unpacked, and that it unpacked into one versioned directory.
            require '^packaged package archive-exists=true' \
              'no release archive was produced'
            require '^packaged package archive-top-level-roots=1' \
              'the archive does not extract into one directory'
            require '^packaged package archive-paths-normalised=true' \
              'the archive holds an absolute path or a parent traversal'
            require '^packaged package archive-entry-kinds=regular-and-directory-only' \
              'the archive holds something that is not a file or a directory'
            require '^packaged package archive-entry-order=normalised' \
              'the archive entries are not in normalised order'
            require '^packaged package archive-entry-timestamps=1' \
              'the archive carries more than one entry timestamp'
            # That the manifest describes the bytes that came out.
            require '^packaged package manifest-covers-archive=exactly' \
              'the manifest and the archive do not describe the same files'
            require '^packaged package manifest-verified-against-extracted-bytes=true' \
              'the manifest was not verified against the extracted bytes'
            require '^packaged package manifest-files=[1-9]' \
              'the manifest describes no file'
            require '^packaged package manifest-self-hash=excluded-and-declared' \
              'the manifest does not declare the one file it cannot hash'
            require '^packaged package runtime-files=[1-9]' \
              'the package carries no runtime file'
            require '^packaged package import-library-present=0' \
              'the runtime archive carries the import library'
            require '^packaged package build-and-source-trees-present=0' \
              'the archive carries a build tree, a source tree or workflow evidence'
            # That the SBOM travelled with it, unchanged, for this target.
            require '^packaged package product-sbom=byte-identical' \
              'the packaged product SBOM is not the committed one'
            # That the staging directory was gone and the package still ran.
            require '^packaged package forbidden-directories-present=0' \
              'the staging or a build tree was still there when the package was started'
            require '^packaged package extracted-files-naming-build-tree=0' \
              'an extracted file still names a directory that is gone'
            require '^packaged package execution=performed' \
              'the extracted package was measured but never run'
            require '^packaged package extracted viewer solver-info exit=0 answer=available' \
              'the extracted application did not answer about its solver'
            require '^packaged package extracted viewer provenance-from-extracted-library=true' \
              'the extracted application did not repeat the library inside the package'
            require '^packaged package extracted cli rebuild-cold exit=0 kernel=occt' \
              'the extracted command line tool did not cross the Open CASCADE boundary'
            require '^packaged package extracted cli document-unchanged=true' \
              'the rebuild changed the document it was diagnosing'
            require '^packaged package extracted viewer hidden-planegcs started=false' \
              'the extracted application ran with planegcs taken away'
            require '^packaged package extracted cli hidden-occt-toolkit started=false' \
              'the extracted command line tool ran with a toolkit taken away'
            require '^packaged package extracted both restored=true' \
              'the package was never shown to work again after the libraries came back'
            require '^packaged package unchanged-by-running=true' \
              'running the package changed files inside it'
            # And which commit it was built from, which is the one thing a
            # package could not say before §21A-2b2b1b and the only thing that
            # tells an archive of this build from an archive of another build
            # carrying the same product version.
            require '^packaged package source-revision=[0-9a-f]' \
              'the package does not say which commit it was built from'

            sed -n "s/^package ${platform} target=//p" "$summary" >> targets.txt
            sed -n "s/^package ${platform} version=//p" "$summary" >> versions.txt
            sed -n "s/^package ${platform} source-revision=//p" "$summary" >> revisions.txt
          done
          [ "$missing" -eq 0 ] || exit 1

          # Three targets, and the three the product has. Deliberately not a
          # comparison of file counts, file names, native digests or archive
          # digests: those differ per target by construction and per host by
          # measurement, and requiring them to agree would be requiring
          # something this repository already knows is false.
          LC_ALL=C sort -u targets.txt > targets-unique.txt
          printf '%s\n' aarch64-apple-darwin x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu | LC_ALL=C sort > targets-expected.txt
          if ! diff -u targets-expected.txt targets-unique.txt; then
            echo "::error::the three platforms did not package the three product targets"
            exit 1
          fi

          if [ "$(LC_ALL=C sort -u versions.txt | wc -l)" -ne 1 ]; then
            echo "::error::the three platforms packaged different product versions"
            cat versions.txt
            exit 1
          fi

          # One commit, and this run's commit. Three archives of one version
          # built from three trees would satisfy everything above: the version
          # matches, the targets are the three, and each package verifies on
          # its own. What they are not is one product.
          if [ "$(LC_ALL=C sort -u revisions.txt | wc -l)" -ne 1 ]; then
            echo "::error::the three platforms packaged different source revisions"
            cat revisions.txt
            exit 1
          fi
          if [ "$(LC_ALL=C sort -u revisions.txt)" != '${{ github.sha }}' ]; then
            echo "::error::the platforms packaged $(LC_ALL=C sort -u revisions.txt) and this run is ${{ github.sha }}"
            exit 1
          fi

          echo "all three platforms packaged their own target's release archive, extracted it"
          echo "with the staging directory and both build trees taken away, ran both shipped"
          echo "binaries out of it, verified every extracted byte against the manifest and"
          echo "carried the committed product SBOM inside it unchanged"
          echo
          echo "version $(LC_ALL=C sort -u versions.txt)"
          echo "source revision $(LC_ALL=C sort -u revisions.txt)"
          # What was measured rather than what was wanted. The two are equal
          # once the comparison above has passed, and printing the expected
          # list would go on looking right if it ever stopped being.
          sed 's/^/target  /' targets-unique.txt

      # ---------------------------------------------------------------------
      # And that the three of them are one release set.
      # ---------------------------------------------------------------------
      #
      # Everything above is about three platforms agreeing. This is about the
      # three archives being one object: three targets, one product version,
      # one source revision, and every byte of every archive pinned by a
      # document that travels with them. It is still an Actions artifact. There
      # is no GitHub Release, no tag, no installer, no signature and no
      # notarisation, and nothing here creates one.

      # Name the three producer artifacts exactly. A glob such as
      # `ferritecad-release-*` also matches the `ferritecad-release-set`
      # artifact this job uploads. That artifact is visible to a re-run of
      # this job in the same workflow run, so the aggregator would download
      # its own previous output and either mix it into its inputs or fail on
      # six archives. Exact names ask only for the three measure-job outputs;
      # when a re-run left more than one artifact with a name, download-
      # artifact selects the latest one.
      - name: Download the Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: ferritecad-release-linux
          path: archives/ferritecad-release-linux

      - name: Download the macOS release archive
        uses: actions/download-artifact@v4
        with:
          name: ferritecad-release-macos
          path: archives/ferritecad-release-macos

      - name: Download the Windows release archive
        uses: actions/download-artifact@v4
        with:
          name: ferritecad-release-windows
          path: archives/ferritecad-release-windows

      - name: Require each archive to have been uploaded
        run: |
          set -euo pipefail
          missing=0
          : > archive-paths.txt
          for platform in linux macos windows; do
            found="$(find "archives/ferritecad-release-${platform}" -name '*.tar.gz' 2>/dev/null | wc -l)"
            if [ "$found" -ne 1 ]; then
              echo "::error::${platform} uploaded ${found} release archives rather than one"
              missing=$((missing + 1))
              continue
            fi
            find "archives/ferritecad-release-${platform}" -name '*.tar.gz' >> archive-paths.txt
          done
          [ "$missing" -eq 0 ] || exit 1

          # And nothing else came down. Three named artifacts each holding one
          # archive is not the same statement as three archives: a fourth
          # artifact matching the pattern would be a fourth archive assembled
          # into the set as though a platform job had produced it.
          total="$(find archives -name '*.tar.gz' | wc -l)"
          if [ "$total" -ne 3 ]; then
            echo "::error::the run carries ${total} release archives rather than three"
            find archives -type f | sed 's/^/  /'
            exit 1
          fi

          LC_ALL=C sort -o archive-paths.txt archive-paths.txt
          while IFS= read -r archive; do
            printf '%s  %s bytes\n' "$(basename "$archive")" "$(wc -c < "$archive" | tr -d ' ')"
          done < archive-paths.txt

      - name: Assemble the three archives into one release set
        run: |
          set -euo pipefail
          arguments=()
          while IFS= read -r archive; do arguments+=(--archive "$archive"); done < archive-paths.txt
          rm -rf release-set
          tools/build-release-set.sh "${arguments[@]}" --output-dir release-set \
            | tee release-set-evidence.txt

      - name: Check the release set, against the release set
        run: |
          set -euo pipefail
          # The build trees as the runner that packed spells them. Neither
          # exists here: vendor/ is ignored and this is a fresh checkout, so a
          # release archive naming either of them is naming a directory that is
          # not on this machine. The checker passes them on to
          # tools/check-release-package.sh, which owns that question and every
          # other question about a single package; nothing about a package is
          # re-implemented for the set.
          tools/check-release-set.sh --release-set release-set \
            --forbidden "${GITHUB_WORKSPACE}/vendor/install" \
            --forbidden "${GITHUB_WORKSPACE}/vendor/planegcs" \
            --output release-set-facts.txt

          # Read back by name rather than trusted to the exit status, the way
          # every platform summary above is read back. A check that stopped
          # asking one of these would still exit zero.
          missing=0
          for wanted in 'release-set archives-verified=3' \
                        'release-set targets=3 order=sorted' \
                        'release-set files=5 extra=0' \
                        'release-set checksums=3 order=sorted escaping=none' \
                        'release-set host-local-values=0'; do
            if ! grep -qF "$wanted" release-set-facts.txt; then
              echo "::error::the release set check produced no fact saying '${wanted}'"
              missing=$((missing + 1))
            fi
          done
          # And that the set is this run's commit rather than some commit.
          if ! grep -qE "^release-set version=.+ source-revision=${{ github.sha }}$" \
                  release-set-facts.txt; then
            echo "::error::the release set was not assembled from ${{ github.sha }}"
            grep '^release-set version=' release-set-facts.txt || true
            missing=$((missing + 1))
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Assemble it again and require the same bytes
        run: |
          set -euo pipefail
          # The two documents are what a recipient compares against, so they
          # have to be a property of the three archives and of nothing else -
          # not of the order the artifacts were downloaded in, not of when the
          # job ran, not of which directory it ran in.
          arguments=()
          while IFS= read -r archive; do arguments+=(--archive "$archive"); done < archive-paths.txt
          rm -rf release-set-again
          tools/build-release-set.sh "${arguments[@]}" --output-dir release-set-again > /dev/null
          for file in ferritecad-release-set.json SHA256SUMS; do
            if ! cmp -s "release-set/${file}" "release-set-again/${file}"; then
              echo "::error::two assemblies of the same three archives produced different ${file}"
              diff -u "release-set/${file}" "release-set-again/${file}" || true
              exit 1
            fi
          done
          echo "two assemblies of the same three archives are byte-identical"
          echo
          cat release-set/ferritecad-release-set.json
          echo
          cat release-set/SHA256SUMS

      - name: Upload the release set
        uses: actions/upload-artifact@v4
        # One artifact, so the three archives and the two documents that
        # describe them cannot be downloaded apart from each other. Still an
        # Actions artifact of this run: it is not published, nothing links to
        # it, and no page of this repository offers it as a download.
        with:
          name: ferritecad-release-set
          path: |
            release-set/*
            release-set-evidence.txt
            release-set-facts.txt
          if-no-files-found: error

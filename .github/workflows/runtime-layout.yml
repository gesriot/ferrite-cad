          esac
          export FCAD_ADD_FILLET_SESSION_ARTIFACTS="$add_fillet_artifacts"
          for gate in sessions::tests::add_fillet::native_dirty_base_four_adds_radius_edit_history_save_branch_match_cli \
            sessions::tests::add_fillet::native_add_on_unsaved_constraints_is_measured_on_solved_lines \
            sessions::tests::add_fillet::native_window_scenario_on_session_files_passes_the_comparator_and_its_controls
          do

# SPDX-License-Identifier: MIT
name: combined runtime layout

# Builds the real FerriteCAD application against pinned Open CASCADE and pinned
# planegcs at the same time, measures what the two of them need at run time, and
# tries to move the result out of both build trees.
#
# Two proofs already exist and neither of them is this one. The OCCT pin builds
# and exercises pinned Open CASCADE, but every downstream executable it launches
# is found by a build-tree loader environment. The planegcs pin builds the real
# viewer against planegcs, but with no Open CASCADE linked at all. No run has
# ever produced a product executable carrying both and then taken both build
# trees away, so the layout of a release is not a thing anybody knows yet.
#
# This workflow measures it, and since §21A-2b2b1a it also packs what it
# measured. The staging directory is still a directory in the runner's
# temporary space; the archive built from it is a versioned file that is
# extracted somewhere else, with the staging and both build trees taken away,
# and started there. That is the difference between a layout that can be run
# and a product that can be handed to somebody.
#
# It is still not a release. There is no installer, no GitHub Release, no
# auto-update, no signing identity and no notarisation. The ad-hoc signature
# the macOS staging applies is what makes a rewritten Mach-O startable at all
# and is not a distribution signature.
#
# The measurement is only worth having if it cannot be satisfied by the machine
# it ran on, so the smoke test runs with LD_LIBRARY_PATH and DYLD_LIBRARY_PATH
# emptied, with the Open CASCADE and planegcs install directories renamed away,
# and with every staged file checked for their names. A run that passes because
# the build tree was still there would look exactly like a run that passed.

on:
  workflow_dispatch:
  push:
    paths:
      # Any workspace input can change a product binary or its native runtime
      # closure. Keeping a hand-written subset of crates here would let a
      # dependency, feature or linker change leave the last measurement green
      # without measuring the product that main now builds.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - 'tools/runtime-closure.sh'
      - 'tools/stage-runtime-layout.sh'
      - 'tools/check-staged-layout.sh'
      - 'tools/check-runtime-probe-opt-in.sh'
      # Changes to the executed FBX campaign and its pinned reader are inputs
      # to this measurement, even when no product source changes.
      - 'tools/check-fbx-complex.sh'
      - 'tools/fbx/**'
      - 'tools/unity-fbx-smoke/scripts/**'
      - 'tools/macos-bundle.sh'
      - 'tools/check-macos-architecture.sh'
      - 'tools/macos-bundle-plist.py'
      - 'tools/build-planegcs.sh'
      - 'tools/planegcs/**'
      # And everything the native/assets inventory is checked against. This
      # workflow is the only thing that stages a layout, so it is the only
      # thing that can check the file boundary; leaving these out let a change
      # to the gate itself land with the last measurement still green. That is
      # not hypothetical - the fix for the Windows asset probe did exactly
      # that and had to be dispatched by hand.
      - 'tools/check-native-inventory.sh'
      - 'tools/generate-native-inventory.sh'
      - 'tools/native/**'
      - 'tools/occt/**'
      - 'tools/notices/lib.sh'
      - 'sbom/native/**'
      # And everything the release archive is made of or checked against.
      # §21A-2b2b1a packs the staged layout here, because this is the only
      # workflow that has a staged layout to pack; a change to the packager,
      # to the manifest schema, to the gate on the extracted archive or to the
      # product SBOM that travels inside it must not leave the last package run
      # green while describing a package nobody built.
      - 'tools/package-release.sh'
      - 'tools/check-release-package.sh'
      - 'tools/check-packager.sh'
      - 'tools/build-release-set.sh'
      - 'tools/check-release-set.sh'
      - 'tools/check-release-set-builder.sh'
      - 'tools/runtime-probe.sh'
      - 'tools/package/**'
      - 'tools/product/**'
      - 'tools/generate-product-sbom.sh'
      - 'tools/check-product-sbom.sh'
      - 'tools/sbom/**'
      - 'sbom/product/**'
      - 'sbom/rust/**'
      - '.github/workflows/runtime-layout.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Negative loader probes intentionally crash children, on disposable runners.
  FCAD_ALLOW_LOADER_FAILURE_PROBES: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            planegcs_library: libplanegcs.so
            cmake_extra: ''
          - os: macos-latest
            name: macos
            planegcs_library: libplanegcs.dylib
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64
          - os: windows-latest
            name: windows
            planegcs_library: planegcs.dll
            # MinGW is on PATH on the runners, and CMake would otherwise pick
            # it over MSVC once Ninja is the generator.
            cmake_extra: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    defaults:
      run:
        # One shell everywhere, so the steps are the same text on all three
        # platforms and a difference in behaviour is a real difference.
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the Apple Silicon macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo '::error::macOS requires native Apple Silicon'; exit 1; }
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin || {
            echo '::error::macOS requires the aarch64-apple-darwin Rust host'; exit 1;
          }

      - uses: Swatinem/rust-cache@v2

      - name: Check explicit opt-in for macOS loader failures without launching binaries
        run: bash tools/check-runtime-probe-opt-in.sh

      # The pin, from the one file that owns it. It used to be written out in
      # this workflow's `env:` block, which made a workflow the only
      # machine-readable owner of a component's version and source digest.
      # §21A-2b2b0b2b1 names Open CASCADE as a component, and a component's
      # identity cannot be a property of the file that happens to build it.
      # Written to GITHUB_ENV rather than sourced per step, because the cache
      # key below is an expression and expressions cannot source a file.
      - name: Read the Open CASCADE pin
        run: |
          set -euo pipefail
          . tools/occt/pin.env
          for name in OCCT_TAG OCCT_VERSION OCCT_COMMIT OCCT_SHA256 OCCT_ARCHIVE_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::tools/occt/pin.env does not set ${name}"
              exit 1
            fi
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
          echo "Open CASCADE ${OCCT_VERSION} at ${OCCT_COMMIT}"

      - name: Install the tools each platform needs
        run: |
          set -euxo pipefail
          case '${{ matrix.name }}' in
            linux)
              sudo apt-get update
              # X11 and GL headers because XCAF links the visualisation
              # toolkits whether or not FerriteCAD opens an Open CASCADE
              # viewer; patchelf because a relocatable ELF layout is a run path
              # this workflow has to set. No Eigen and no Boost: planegcs is
              # built against the source tools/planegcs/pin.env names, and a
              # header directory installed here would be a second answer to
              # what the release was compiled from.
              sudo apt-get install -y --no-install-recommends \
                ninja-build patchelf \
                libx11-dev libxext-dev libxmu-dev libxi-dev \
                libgl1-mesa-dev libglu1-mesa-dev
              ;;
            macos)
              # GNU tar as well as ninja. `tar` on macOS is bsdtar, which has
              # no --sort and would give an archive whose entry order came
              # from readdir; the packager refuses to use it and says so.
              # Named here rather than relied on from the image, because a
              # runner image that dropped it would turn a reproducibility
              # requirement into a missing command.
              brew install ninja gnu-tar
              ;;
            windows)
              choco install ninja -y --no-progress
              ;;
          esac

      - name: Locate MSVC
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo ::error::vswhere found no Visual Studio with the C++ toolset
            exit /b 1
          )
          echo Visual Studio at %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set > vcvars-env.txt

      - name: Export the MSVC environment
        if: matrix.name == 'windows'
        run: |
          set -euo pipefail
          # An allow-list rather than the whole vcvars environment: exporting
          # all of it publishes around fifty names, one of which is the generic
          # `Platform`, and Windows environment variables are case-insensitive.
          # docs/build-occt.md records what that cost the OCCT workflow.
          grep -Ei '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=' \
            vcvars-env.txt >> "$GITHUB_ENV"
          install_dir="$(grep -i '^VCToolsInstallDir=' vcvars-env.txt | head -1 | cut -d= -f2-)"
          rm -f vcvars-env.txt
          if [ -z "$install_dir" ]; then
            echo "::error::vcvars did not say where the MSVC tools are"
            exit 1
          fi

          # Git Bash injects its own /usr/bin at the front of PATH whenever a
          # shell starts, and /usr/bin holds a GNU `link.exe` that has nothing
          # to do with linking programs. cmake records the compiler's full path
          # at configure time and is unaffected; rustc invokes link.exe by name
          # and gets the wrong one. Naming the linker outright stops depending
          # on the order of a PATH this shell rewrites.
          tools="$(cygpath -u "$install_dir")bin/Hostx64/x64"
          if [ ! -x "$tools/link.exe" ]; then
            echo "::error::no MSVC link.exe under $tools"
            exit 1
          fi
          {
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$tools/link.exe")"
            # dumpbin is reached the same way and for the same reason: it is
            # what reads the import table, and a measurement that cannot run
            # its own inspector must say so rather than conclude anything.
            echo "FCAD_MSVC_BIN=$tools"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Open CASCADE, from the pin.
      # ---------------------------------------------------------------------

      - name: Restore a cached Open CASCADE build
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/install
          # Keyed on the pinned commit, so a changed pin cannot silently reuse
          # the previous kernel. Deliberately not the OCCT pin workflow's own
          # key: that cache carries records this workflow does not write, and
          # sharing the name would let one workflow hand the other an install
          # it considers incomplete.
          key: occt-layout-${{ env.OCCT_COMMIT }}-${{ matrix.name }}-${{ runner.arch }}-v1

      - name: Build pinned Open CASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o occt.tar.gz "${OCCT_ARCHIVE_URL}"
          case '${{ matrix.name }}' in
            macos) actual="$(shasum -a 256 occt.tar.gz | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum occt.tar.gz | cut -d' ' -f1)" ;;
          esac
          if [ "$actual" != "$OCCT_SHA256" ]; then
            echo "::error::Open CASCADE archive digest ${actual}, the pin says ${OCCT_SHA256}"
            exit 1
          fi
          mkdir -p occt
          tar -xzf occt.tar.gz -C occt --strip-components=1

          # These flags are docs/build-occt.md's, character for character, and
          # they are why the closure below has no FreeType and no TBB in it. A
          # measurement taken against a differently configured kernel would be
          # a measurement of some other product.
          cmake -S occt -B occt-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Draw=OFF \
            -DUSE_TK=OFF -DUSE_TCL=OFF -DUSE_FREETYPE=OFF -DUSE_VTK=OFF \
            -DBUILD_DOC_Overview=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/vendor/install"

          # Read back rather than trusted: an unknown option is only a warning
          # to CMake, and a static Open CASCADE would change the licence
          # position of the whole product.
          value="$(sed -n 's/^BUILD_LIBRARY_TYPE:[^=]*=//p' occt-build/CMakeCache.txt)"
          if [ "$value" != "Shared" ]; then
            echo "::error::Open CASCADE configured with BUILD_LIBRARY_TYPE=${value:-<unset>}"
            exit 1
          fi

          cmake --build occt-build --parallel
          cmake --install occt-build

      - name: Save the fresh Open CASCADE build
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/install
          key: occt-layout-${{ env.OCCT_COMMIT }}-${{ matrix.name }}-${{ runner.arch }}-v1

      - name: Say where Open CASCADE is
        id: occt
        run: |
          set -euo pipefail
          config="$(find vendor/install -name 'OpenCASCADEConfig.cmake' -print -quit)"
          if [ -z "$config" ]; then
            echo "::error::no OpenCASCADEConfig.cmake under vendor/install"
            find vendor/install -maxdepth 3 -type d | head -40
            exit 1
          fi
          config_dir="$(cd "$(dirname "$config")" && pwd)"

          case '${{ matrix.name }}' in
            windows) pattern='TKernel.dll' ;;
            macos)   pattern='libTKernel*.dylib' ;;
            *)       pattern='libTKernel.so*' ;;
          esac
          lib="$(find vendor/install -name "$pattern" -print -quit)"
          if [ -z "$lib" ]; then
            echo "::error::no shared TKernel under vendor/install; this is not a shared build"
            exit 1
          fi
          lib_dir="$(cd "$(dirname "$lib")" && pwd)"

          # The libraries and the CMake package can live in different places on
          # Windows, where the DLLs are installed to bin/ and the import
          # libraries to lib/. The closure is about the DLLs.
          case '${{ matrix.name }}' in
            windows)
              dll="$(find vendor/install -name 'TKernel.dll' -print -quit)"
              lib_dir="$(cd "$(dirname "$dll")" && pwd)"
              ;;
          esac

          {
            echo "config_dir=$config_dir"
            echo "lib_dir=$lib_dir"
          } >> "$GITHUB_OUTPUT"
          echo "config: $config_dir"
          echo "libs:   $lib_dir"

      # ---------------------------------------------------------------------
      # planegcs, from its own pin.
      # ---------------------------------------------------------------------

      - name: Require one owner of the native build inputs
        run: tools/check-planegcs-pins.sh

      - name: Build pinned planegcs
        run: |
          set -euxo pipefail
          # Eigen and Boost come with it, by digest, from tools/planegcs/pin.env.
          # Neither was installed on this runner, so what the closure below
          # measures is a library built from checked source rather than from
          # whatever the image happened to carry.
          tools/build-planegcs.sh "$PWD/vendor/planegcs"
          if [ '${{ matrix.name }}' = windows ]; then
            echo "FCAD_PLANEGCS_DIR=$(cygpath -w "$PWD/vendor/planegcs")" >> "$GITHUB_ENV"
          else
            echo "FCAD_PLANEGCS_DIR=$PWD/vendor/planegcs" >> "$GITHUB_ENV"
          fi

      - name: Require the planegcs delivery to carry its own native build inputs
        run: tools/check-planegcs-delivery.sh "$PWD/vendor/planegcs"

      - name: Require both components to be replaceable shared libraries
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          out="$PWD/vendor/planegcs"
          libs="${{ steps.occt.outputs.lib_dir }}"

          # The licence position of this whole slice rests on both components
          # being shared and replaceable. A static one would pass every timing
          # and every exit code below and would be a different product.
          # `file -L` everywhere a toolkit is named: the install is a chain of
          # symlinks, and `file` on a link reports a link rather than what it
          # points at, which would fail this check for the wrong reason.
          case '${{ matrix.name }}' in
            linux)
              file -L "$out/${{ matrix.planegcs_library }}" | grep -q 'shared object' \
                || fail 'planegcs is not a shared object'
              file -L "$(find "$libs" -name 'libTKernel.so*' -print -quit)" \
                | grep -q 'shared object' \
                || fail 'Open CASCADE is not a shared object' ;;
            macos)
              file -L "$out/${{ matrix.planegcs_library }}" \
                | grep -q 'dynamically linked shared library' \
                || fail 'planegcs is not a dynamic library'
              file -L "$(find "$libs" -name 'libTKernel*.dylib' -print -quit)" \
                | grep -q 'dynamically linked shared library' \
                || fail 'Open CASCADE is not a dynamic library' ;;
            windows)
              "$FCAD_MSVC_BIN/dumpbin.exe" //HEADERS \
                "$(cygpath -w "$out/${{ matrix.planegcs_library }}")" \
                | grep -q 'DLL' || fail 'planegcs is not a DLL'
              "$FCAD_MSVC_BIN/dumpbin.exe" //HEADERS "$(cygpath -w "$libs/TKernel.dll")" \
                | grep -q 'DLL' || fail 'Open CASCADE is not a DLL' ;;
          esac
          echo "both components are shared libraries a package could replace"

      # ---------------------------------------------------------------------
      # The combined build. This is the first one there has ever been.
      # ---------------------------------------------------------------------

      - name: Build circles with OCCT and refuse constraints without the solver
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '0'
          CARGO_BUILD_JOBS: '1'
          CMAKE_BUILD_PARALLEL_LEVEL: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # No feature means no solver, even though its library exists. The
          # following native build restores the shipped CLI in the same target.
          case '${{ matrix.name }}' in
            windows) export PATH="$FCAD_OCCT_LIB_DIR:$PATH" ;;
            macos) export DYLD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR"; export DYLD_FALLBACK_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR" ;;
            linux) export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR" ;;
          esac
          cargo build --release --no-default-features -p ferritecad-cli
          gate=occt_without_solver_builds_plain_circles_and_refuses_circle_constraints
          cargo test --release --no-default-features -p ferritecad-cli \
            --test circle_constraints "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee circle-no-solver.log
          if grep -q 'skipped:' circle-no-solver.log \
             || ! grep -Fq "test $gate ... ok" circle-no-solver.log; then
            echo "::error::mixed OCCT/no-solver gate did not execute"; exit 1
          fi
          # The same build, the same target, the hollow part: a ring still
          # builds and cold-rebuilds without a solver, and constraining it
          # refuses without publishing. Spelled out rather than looped over a
          # table, for the reason the circle gate below this one gives.
          gate=occt_without_solver_builds_plain_annuli_and_refuses_annular_constraints
          cargo test --release --no-default-features -p ferritecad-cli \
            --test annular_constraints "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee annular-no-solver.log
          if grep -q 'skipped:' annular-no-solver.log \
             || ! grep -Fq "test $gate ... ok" annular-no-solver.log; then
            echo "::error::mixed OCCT/no-solver annular gate did not execute"; exit 1
          fi
          # A cut needs no solver at all: the part it cuts is unconstrained, and
          # a build with a kernel and no planegcs must make the same solid.
          gate=occt_without_solver_cuts_an_unconstrained_part
          cargo test --release --no-default-features -p ferritecad-cli \
            --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee cut-no-solver.log
          if grep -q 'skipped:' cut-no-solver.log \
             || ! grep -Fq "test $gate ... ok" cut-no-solver.log; then
            echo "::error::mixed OCCT/no-solver cut gate did not execute"; exit 1
          fi
          # And changing that cut's numbers asks a solver nothing either. Its
          # own command rather than a loop, for the reason the gate above it
          # gives: a table would hide which of them stopped executing.
          gate=occt_without_solver_edits_an_unconstrained_cut
          cargo test --release --no-default-features -p ferritecad-cli \
            --test edit_circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee cut-edit-no-solver.log
          if grep -q 'skipped:' cut-edit-no-solver.log \
             || ! grep -Fq "test $gate ... ok" cut-edit-no-solver.log; then
            echo "::error::mixed OCCT/no-solver cut edit gate did not execute"; exit 1
          fi

          gate=sequential::occt_without_solver_builds_two_unconstrained_cuts
          cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee sequential-no-solver.log
          if grep -q 'skipped:' sequential-no-solver.log || ! grep -Fq "test $gate ... ok" sequential-no-solver.log; then
            echo "::error::mixed sequential cut gate did not execute"; exit 1
          fi

          gate=sequential::edits::occt_without_solver_edits_both_history_links
          cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee edit-sequential-no-solver.log
          if grep -q 'skipped:' edit-sequential-no-solver.log || ! grep -Fq "test $gate ... ok" edit-sequential-no-solver.log; then exit 1; fi

          gate=sequential::history::occt_without_solver_builds_and_edits_history
          cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee history-no-solver.log
          if grep -q 'skipped:' history-no-solver.log || ! grep -Fq "test $gate ... ok" history-no-solver.log; then exit 1; fi

          gate=sequential::base_sketch::occt_without_solver_edits_cut_base
          cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee base-sketch-no-solver.log
          if grep -q 'skipped:' base-sketch-no-solver.log || ! grep -Fq "test $gate ... ok" base-sketch-no-solver.log; then exit 1; fi

          gate=sequential::base_height::occt_without_solver_edits_cut_base_height
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee base-height-no-solver.log
          if grep -q 'skipped:' base-height-no-solver.log || ! grep -Fq "test $gate ... ok" base-height-no-solver.log; then exit 1; fi

          # §26H: ThroughAll is computed from the base extrusion, not solved.
          gate=sequential::through_all::occt_without_solver_keeps_through_all_through
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee through-all-no-solver.log
          if grep -q 'skipped:' through-all-no-solver.log || ! grep -Fq "test $gate ... ok" through-all-no-solver.log; then exit 1; fi

          # §26I: an unconstrained polygon base needs a kernel and no solver.
          gate=sequential::polygon::native_sloped_polygons_both_windings_translated
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test circular_cut "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee polygon-no-solver.log
          if grep -q 'skipped:' polygon-no-solver.log || ! grep -Fq "test $gate ... ok" polygon-no-solver.log; then exit 1; fi

          # §27A: a full-turn Revolve of an unconstrained Line profile needs a
          # kernel and no solver.
          gate=occt_without_solver_revolves_a_profile
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-no-solver.log
          if grep -q 'skipped:' revolve-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-no-solver.log; then exit 1; fi

          # §27B: editing that profile's coordinates needs no solver either.
          gate=edit::occt_without_solver_edits_a_revolve_profile
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-edit-no-solver.log
          if grep -q 'skipped:' revolve-edit-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-edit-no-solver.log; then exit 1; fi

          # §27C: a solid Revolve closed on the axis, created and edited with a
          # kernel and no solver.
          gate=axis::occt_without_solver_builds_and_edits_a_solid_revolve
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-axis-no-solver.log
          if grep -q 'skipped:' revolve-axis-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-axis-no-solver.log; then exit 1; fi

          # §27D: a partial Revolve sector of an unconstrained Line profile
          # needs a kernel and no solver.
          gate=partial::occt_without_solver_turns_a_partial_revolve
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-partial-no-solver.log
          if grep -q 'skipped:' revolve-partial-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-partial-no-solver.log; then exit 1; fi

          # §27E: editing a saved sector's angle needs a kernel and no solver.
          gate=angle::occt_without_solver_edits_a_partial_revolve_angle
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-angle-no-solver.log
          if grep -q 'skipped:' revolve-angle-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-angle-no-solver.log; then exit 1; fi

          # §27F: editing a saved sector's profile needs a kernel and no solver.
          gate=profile::occt_without_solver_edits_a_partial_revolve_profile
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-profile-no-solver.log
          if grep -q 'skipped:' revolve-profile-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-profile-no-solver.log; then exit 1; fi

          # §27G: without a solver a constrained Revolve is refused, typed.
          gate=constraints::occt_without_solver_refuses_revolve_constraints_honestly
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-constraints-no-solver.log
          if grep -q 'skipped:' revolve-constraints-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-constraints-no-solver.log; then exit 1; fi

          # §27H: and so is a constrained solid Revolve, closed on the axis.
          gate=axis_constraints::occt_without_solver_refuses_axis_closed_constraints_honestly
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test revolve "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee revolve-axis-constraints-no-solver.log
          if grep -q 'skipped:' revolve-axis-constraints-no-solver.log || ! grep -Fq "test $gate ... ok" revolve-axis-constraints-no-solver.log; then exit 1; fi

          # §28A: rounding one edge of an unconstrained plate asks no solver
          # anything; the same measured gates pass in this build.
          gate=native_two_corners_both_windings_and_starts_are_what_the_numbers_say
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-no-solver.log
          if grep -q 'skipped:' fillet-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-no-solver.log; then exit 1; fi
          gate=native_changing_the_plate_invalidates_the_cached_fillet
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-cache-no-solver.log
          if grep -q 'skipped:' fillet-cache-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-cache-no-solver.log; then exit 1; fi
          # §28B: nor does editing that Fillet's radius.
          for gate in radius::native_radius_edits_move_the_named_cylinder_and_keep_every_identity \
            radius::native_a_changed_radius_misses_in_place_and_the_plate_is_reused \
            height::native_height_edits_keep_the_named_cylinder_and_every_identity \
            height::native_a_changed_height_misses_in_place_and_interleaves_with_the_radius \
            sketch::native_sketch_edits_move_the_rounded_corner_and_keep_every_identity \
            sketch::native_a_moved_rectangle_misses_in_place_and_interleaves_with_height_and_radius
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-radius-no-solver.log
            if grep -q 'skipped:' fillet-radius-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-radius-no-solver.log; then exit 1; fi
          done
          # And the public recipe, against this build's own CLI.
          py="$(command -v python3 || command -v python)"
          recipe_cli="$PWD/target/release/ferritecad"
          case '${{ matrix.name }}' in
            windows) recipe_cli="$(cygpath -w "$recipe_cli.exe")" ;;
          esac
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/single-edge-fillet.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28A_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28a-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28a-recipe.py | tee fillet-recipe-no-solver.log
          grep -q '^FCAD_28A_RECIPE_OK ' fillet-recipe-no-solver.log
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-radius.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28B_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28b-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28b-recipe.py | tee fillet-radius-recipe-no-solver.log
          grep -q '^FCAD_28B_RECIPE_OK ' fillet-radius-recipe-no-solver.log
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-base-height.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28C_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28c-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28c-recipe.py | tee fillet-height-recipe-no-solver.log
          grep -q '^FCAD_28C_RECIPE_OK ' fillet-height-recipe-no-solver.log
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-fillet-base-sketch.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28D_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28d-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28d-recipe.py | tee fillet-sketch-recipe-no-solver.log
          grep -q '^FCAD_28D_RECIPE_OK ' fillet-sketch-recipe-no-solver.log
          # §28E: without a solver the rounded plate still builds, its
          # constraints are discovered, and a constraint copy is refused.
          for gate in constraints::constraint_discovery_and_protocol_without_native \
            constraints::occt_without_solver_refuses_a_constrained_rounded_plate
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-constraints-no-solver.log
            if grep -q 'skipped:' fillet-constraints-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-constraints-no-solver.log; then exit 1; fi
          done
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/fillet-base-constraints.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28E_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28e-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28e-recipe.py | tee fillet-constraints-recipe-no-solver.log
          grep -q '^FCAD_28E_RECIPE_NO_SOLVER ' fillet-constraints-recipe-no-solver.log
          # §28F: without a solver a plain plate is still rounded, a
          # dimensioned plate is discovered, and rounding it is refused.
          for gate in constraints::first::rounding_discovery_and_protocol_without_native \
            constraints::first::occt_without_solver_refuses_rounding_a_dimensioned_plate
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-first-no-solver.log
            if grep -q 'skipped:' fillet-first-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-first-no-solver.log; then exit 1; fi
          done
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/fillet-constrained-plate.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28F_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28f-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28f-recipe.py | tee fillet-first-recipe-no-solver.log
          grep -q '^FCAD_28F_RECIPE_NO_SOLVER ' fillet-first-recipe-no-solver.log
          # §28G: a second Fillet on an unconstrained plate needs no solver.
          gate=sequential::sequential_discovery_and_protocol_without_native
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-second-no-solver.log
          if grep -q 'skipped:' fillet-second-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-second-no-solver.log; then exit 1; fi
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/sequential-edge-fillets.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28G_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28g-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28g-recipe.py | tee fillet-second-recipe-no-solver.log
          grep -q '^FCAD_28G_RECIPE_OK ' fillet-second-recipe-no-solver.log
          # §28H: either radius of an unconstrained two-Fillet plate needs no solver.
          gate=sequential::radius::radius_discovery_and_protocol_without_native
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-radii-no-solver.log
          if grep -q 'skipped:' fillet-radii-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-radii-no-solver.log; then exit 1; fi
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-sequential-fillet-radii.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28H_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28h-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28h-recipe.py | tee fillet-radii-recipe-no-solver.log
          grep -q '^FCAD_28H_RECIPE_OK ' fillet-radii-recipe-no-solver.log
          # §28I: the height under two Fillets of an unconstrained plate needs no solver.
          gate=sequential::height::height_discovery_and_protocol_without_native
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-two-height-no-solver.log
          if grep -q 'skipped:' fillet-two-height-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-two-height-no-solver.log; then exit 1; fi
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-two-fillet-base-height.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28I_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28i-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28i-recipe.py | tee fillet-two-height-recipe-no-solver.log
          grep -q '^FCAD_28I_RECIPE_OK ' fillet-two-height-recipe-no-solver.log
          # §28J: the Sketch of an unconstrained plate rounded twice needs no solver.
          gate=sequential::sketch::sketch_discovery_and_protocol_without_native
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-two-sketch-no-solver.log
          if grep -q 'skipped:' fillet-two-sketch-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-two-sketch-no-solver.log; then exit 1; fi
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-two-fillet-base-sketch.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28J_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28j-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28j-recipe.py | tee fillet-two-sketch-recipe-no-solver.log
          grep -q '^FCAD_28J_RECIPE_OK ' fillet-two-sketch-recipe-no-solver.log
          # §28K: the constraints of a two-Fillet plate need the solver: discovery is
          # offered, the recipe stops at its first constraint step without one.
          gate=sequential::constraints::constraint_discovery_and_protocol_without_native
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee fillet-two-constraints-no-solver.log
          if grep -q 'skipped:' fillet-two-constraints-no-solver.log || ! grep -Fq "test $gate ... ok" fillet-two-constraints-no-solver.log; then exit 1; fi
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-two-fillet-base-constraints.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28K_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28k-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28k-recipe.py | tee fillet-two-constraints-recipe-no-solver.log
          grep -q '^FCAD_28K_RECIPE_NO_SOLVER ' fillet-two-constraints-recipe-no-solver.log
          # §28L: with a kernel and no solver the free plate is rounded four times and the recipe stops at the constraints.
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/rectangular-fillet-history.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_28L_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-28l-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-28l-recipe.py | tee fillet-four-recipe-no-solver.log
          grep -q '^FCAD_28L_RECIPE_NO_SOLVER ' fillet-four-recipe-no-solver.log

      - name: Chamfer a plate with Open CASCADE and no solver
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '0'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # §29A: the previous step left the no-solver CLI in target/release.
          case '${{ matrix.name }}' in
            windows) export PATH="$FCAD_OCCT_LIB_DIR:$PATH" ;;
            macos) export DYLD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR"; export DYLD_FALLBACK_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR" ;;
            linux) export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR" ;;
          esac
          py="$(command -v python3 || command -v python)"
          recipe_cli="$PWD/target/release/ferritecad"
          case '${{ matrix.name }}' in
            windows) recipe_cli="$(cygpath -w "$recipe_cli.exe")" ;;
          esac
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/rectangular-corner-chamfer.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_29A_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-29a-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-29a-recipe.py | tee chamfer-recipe-no-solver.log
          grep -q '^FCAD_29A_RECIPE_OK ' chamfer-recipe-no-solver.log
          # §29B: the same plate made taller and shorter through edit-extrude, with a kernel and no solver.
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-chamfer-base-height.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_29B_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-29b-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-29b-recipe.py | tee chamfer-height-recipe-no-solver.log
          grep -q '^FCAD_29B_RECIPE_OK ' chamfer-height-recipe-no-solver.log
          # §29C: the same plate moved and resized through edit-sketch-copy, with a kernel and no solver.
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-chamfer-base-sketch.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_29C_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-29c-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-29c-recipe.py | tee chamfer-sketch-recipe-no-solver.log
          grep -q '^FCAD_29C_RECIPE_OK ' chamfer-sketch-recipe-no-solver.log
          # §29D: without a solver the chamfered plate still builds, its constraints are
          # discovered, and a constraint copy is refused; the recipe stops at the solver.
          for gate in chamfer::base_constraints::chamfer_constraint_discovery_and_protocol_without_native \
            chamfer::base_constraints::occt_without_solver_refuses_a_constrained_chamfered_plate
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-cli --test fillet "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee chamfer-constraints-no-solver.log
            if grep -q 'skipped:' chamfer-constraints-no-solver.log || ! grep -Fq "test $gate ... ok" chamfer-constraints-no-solver.log; then exit 1; fi
          done
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/edit-chamfer-base-constraints.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_29D_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-29d-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-29d-recipe.py | tee chamfer-constraints-recipe-no-solver.log
          grep -q '^FCAD_29D_RECIPE_NO_SOLVER ' chamfer-constraints-recipe-no-solver.log
          # §30A: with a kernel and no solver, Apply to a constrained plate is refused
          # and the document stays clean, and the plain plate still goes through.
          for gate in sessions::tests::without_the_solver_an_apply_to_a_constrained_plate_is_refused_and_nothing_changes \
            sessions::tests::native_an_ordinary_plate_is_applied_undone_exported_and_saved_like_the_command_line \
            sessions::tests::native_vertices_of_an_ordinary_offset_polygon_are_applied_like_the_command_line \
            sessions::tests::without_the_solver_a_constraints_apply_is_refused_and_nothing_changes \
            sessions::tests::analytic::native_a_circle_with_a_fractional_offset_is_applied_like_the_command_line \
            sessions::tests::analytic::native_an_annulus_with_unequal_fractional_radii_is_applied_like_the_command_line \
            sessions::tests::analytic::native_an_annulus_stored_bore_first_keeps_its_roles_by_curve_uuid
          do
            FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release -p ferritecad-app --bin ferritecad-viewer "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee session-no-solver.log
            if grep -q 'skipped:' session-no-solver.log || ! grep -Fq "test $gate ... ok" session-no-solver.log; then exit 1; fi
          done

          gate=sessions::tests::angle::mixed_angle_apply_needs_no_solver_until_the_profile_is_constrained
          FERRITECAD_REQUIRE_PLANEGCS=0 cargo test --release --no-default-features -p ferritecad-app --bin ferritecad-viewer "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee session-angle-mixed.log
          if grep -q 'skipped:' session-angle-mixed.log || ! grep -Fq "test $gate ... ok" session-angle-mixed.log; then exit 1; fi
          gate=sessions::tests::cut::mixed_cut_apply_uses_occt_without_solver
          cargo test --release -p ferritecad-app --bin ferritecad-viewer "$gate" \
            -- --exact --nocapture --test-threads=1 2>&1 | tee session-cut-mixed.log
          if grep -q 'skipped:' session-cut-mixed.log || ! grep -Fq "test $gate ... ok" session-cut-mixed.log; then exit 1; fi
          gate=sessions::tests::add_cut::mixed_add_cut_uses_occt_without_solver
          cargo test --release -p ferritecad-app --bin ferritecad-viewer "$gate" \

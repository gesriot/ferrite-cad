          export FCAD_ANALYTIC_ARTIFACTS="$analytic_artifacts"
          for gate in sessions::tests::analytic::native_a_circle_with_a_fractional_offset_is_applied_like_the_command_line \
            sessions::tests::analytic::native_an_annulus_with_unequal_fractional_radii_is_applied_like_the_command_line \
            sessions::tests::analytic::native_an_annulus_stored_bore_first_keeps_its_roles_by_curve_uuid \
            sessions::tests::analytic::native_constraints_applied_through_the_session_withdraw_and_restore_the_circle_editor
          do
            cargo test --release --features planegcs -p ferritecad-app --bin ferritecad-viewer "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee session-analytic.log
            if grep -q 'skipped:' session-analytic.log || ! grep -Fq "test $gate ... ok" session-analytic.log; then
              echo "::error::${gate} did not run and pass on this platform"

            constraints::tests::chamfer_base_constraint_widgets_name_the_chamfer_and_keep_the_draft \
            constraints::tests::native_chamfer_base_constraint_worker_and_cli_publish_the_same_part
          do
            cargo test --release --features planegcs -p ferritecad-app "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee chamfer-ui.log
            if grep -q 'skipped:' chamfer-ui.log || ! grep -Fq "test $gate ... " chamfer-ui.log \
              || ! grep -q '^test result: ok\. 1 passed; 0 failed' chamfer-ui.log; then exit 1; fi
          done
          py="$(command -v python3 || command -v python)"
          recipe_cli="$PWD/target/release/ferritecad"
          case '${{ matrix.name }}' in
            windows) recipe_cli="$(cygpath -w "$recipe_cli.exe")" ;;
          esac
          "$py" - <<'EXTRACT'
          from pathlib import Path
          text = Path("docs/rectangular-corner-chamfer.md").read_text(encoding="utf-8")
          code = text.split("# FCAD_29A_AGENT_RECIPE\n", 1)[1].split("\n```", 1)[0]
          Path("ferrite-29a-recipe.py").write_text(code, encoding="utf-8")
          EXTRACT
          FERRITECAD="$recipe_cli" "$py" ferrite-29a-recipe.py | tee chamfer-recipe.log
          grep -q '^FCAD_29A_RECIPE_OK ' chamfer-recipe.log
          # §29B: the same plate made taller and shorter through the same edit-extrude.

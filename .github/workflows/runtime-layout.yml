          if grep -q 'skipped:' session-recovery-mixed.log || ! grep -Fq "test $gate ... ok" session-recovery-mixed.log; then exit 1; fi
          grep -q '^FCAD_30M_MIXED_RECOVERY_EXECUTED$' session-recovery-mixed.log
          gate=sessions::tests::fillet::mixed_radius_apply_uses_occt_without_solver

      - name: Build the real application and the command line tool against both
        id: build
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
        run: |
          set -euo pipefail
          # Required on both counts, so that a kernel or a solver that failed to
          # link stops the build rather than producing an executable that would
          # go on to measure a smaller closure and call it the answer.
          if ! cargo build --release --features planegcs \
            -p ferritecad-app --bin ferritecad-viewer \
            -p ferritecad-cli --bin ferritecad \
            --message-format=json > build.json; then
            echo "::group::the same build, in words"
            cargo build --release --features planegcs \
              -p ferritecad-app --bin ferritecad-viewer \
              -p ferritecad-cli --bin ferritecad || true
            echo "::endgroup::"
            echo "::error::the product did not build against both pinned components"
            exit 1
          fi

          find_binary() {
            jq -r --arg name "$1" 'select(.reason == "compiler-artifact")
                                   | select(.target.name == $name)
                                   | select(.target.kind | index("bin"))
                                   | .executable // empty' build.json \
              | tr -d '\r' | tail -1
          }
          viewer="$(find_binary ferritecad-viewer)"
          cli="$(find_binary ferritecad)"
          [ -n "$viewer" ] || { echo "::error::cargo did not say where ferritecad-viewer is"; exit 1; }
          [ -n "$cli" ] || { echo "::error::cargo did not say where ferritecad is"; exit 1; }

          readable() {
            if [ '${{ matrix.name }}' = windows ]; then cygpath -u "$1"; else printf '%s' "$1"; fi
          }
          viewer_readable="$(readable "$viewer")"
          cli_readable="$(readable "$cli")"
          [ -f "$viewer_readable" ] || { echo "::error::no file at $viewer"; exit 1; }
          [ -f "$cli_readable" ] || { echo "::error::no file at $cli"; exit 1; }

          {
            echo "viewer=$viewer_readable"
            echo "cli=$cli_readable"
          } >> "$GITHUB_OUTPUT"
          echo "viewer $viewer_readable ($(wc -c < "$viewer_readable") bytes)"
          echo "cli    $cli_readable ($(wc -c < "$cli_readable") bytes)"

      - name: Require the viewer to be the application and not a test executable
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
        run: |
          set -euo pipefail
          # Every test executable cargo would produce for these two packages,
          # taken from cargo rather than from a list of names somebody has to
          # remember to extend. Everything after this step is a statement about
          # the program a person runs, and it would look exactly the same if it
          # were about a test harness.
          cargo test --release --features planegcs \
            -p ferritecad-app -p ferritecad-cli --no-run --message-format=json \
            > tests.json
          # `.profile.test`, not `.target.test`. The second is a property of the
          # target definition: a bin has unit tests, so cargo reports it as
          # testable, and under `--no-run` it emits two artifacts for that bin
          # - the test harness under deps/, and the ordinary executable. Asking
          # the wrong one puts `target/release/ferritecad-viewer` in this list
          # and makes the comparison below reject the application for being
          # itself. `.profile.test` is a property of the compilation and names
          # only the harnesses, including the viewer's own, which is precisely
          # the executable that could be mistaken for the application.
          jq -r 'select(.reason == "compiler-artifact")
                 | select(.profile.test == true)
                 | .executable // empty' tests.json | tr -d '\r' \
            | LC_ALL=C sort -u > test-binaries.txt
          if [ ! -s test-binaries.txt ]; then
            echo "::error::no test executable was built, so the comparison below is vacuous"
            exit 1
          fi

          for binary in '${{ steps.build.outputs.viewer }}' '${{ steps.build.outputs.cli }}'; do
            native="$binary"
            if [ '${{ matrix.name }}' = windows ]; then native="$(cygpath -w "$binary")"; fi
            if grep -Fxq "$native" test-binaries.txt || grep -Fxq "$binary" test-binaries.txt; then
              echo "::error::${binary} is one of the test executables, not the application"
              exit 1
            fi
            case "$(basename "$binary")" in
              ferritecad-viewer | ferritecad-viewer.exe | ferritecad | ferritecad.exe) ;;
              *) echo "::error::${binary} is not a product binary"; exit 1 ;;
            esac
          done
          echo "$(wc -l < test-binaries.txt) test executable(s) exist, and neither product"
          echo "binary is one of them"

      - name: Edit existing extrusions through both native clients
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # These already-built release tests invoke the actual CLI binary and
          # the window's worker. Both native libraries must be available; this
          # is the regular three-platform gate, not a no-kernel skip or --no-run.
          libs="$FCAD_OCCT_LIB_DIR:$PWD/vendor/planegcs"
          case '${{ matrix.name }}' in
            windows) export PATH="$libs:$PATH" ;;
            macos) export DYLD_LIBRARY_PATH="$libs"; export DYLD_FALLBACK_LIBRARY_PATH="$libs" ;;
            linux) export LD_LIBRARY_PATH="$libs" ;;
          esac
          cargo test --release --features planegcs -p ferritecad-app \
            --bin ferritecad-viewer edits::tests:: -- --nocapture 2>&1 | tee edit-tests.log
          if grep -q 'skipped:' edit-tests.log; then
            echo "::error::a native edit gate skipped itself"
            exit 1
          fi
          for gate in \
            one_source_ui_and_cli_preserve_all_ids_rebuild_and_export_the_changed_model \
            imported_blobs_unknown_tables_and_unselected_payloads_survive_edit \
            hidden_row_identity_and_stored_triggers_refuse_publication \
            foreign_key_actions_refuse_publication_without_changing_extension_data \
            cancellation_before_and_after_publish_and_stale_answers_keep_honest_outcomes \
            published_output_and_open_failure_are_separate_from_the_accepted_scene \
            cancelling_the_form_and_a_closed_save_dialog_do_no_work \
            shutdown_cancels_and_joins_the_edit_worker_before_it_can_publish
          do
            if ! grep -q "^test edits::tests::${gate} \.\.\. ok$" edit-tests.log; then
              echo "::error::${gate} did not run and pass on this platform"
              exit 1
            fi
          done

      - name: Edit, Undo, Redo, export and Save one open document through the native window state
        env:
          FERRITECAD_REQUIRE_OCCT: '1'
          FERRITECAD_REQUIRE_PLANEGCS: '1'
          OpenCASCADE_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # §30A: the window's session, worker and exports against the peer command
          # line, on a plain plate and on a constrained chamfered plate. Both native
          # libraries are required; a gate that skips itself fails here.
          libs="$FCAD_OCCT_LIB_DIR:$PWD/vendor/planegcs"
          case '${{ matrix.name }}' in
            windows) export PATH="$libs:$PATH" ;;
            macos) export DYLD_LIBRARY_PATH="$libs"; export DYLD_FALLBACK_LIBRARY_PATH="$libs" ;;
            linux) export LD_LIBRARY_PATH="$libs" ;;
          esac
          for gate in sessions::tests::native_an_ordinary_plate_is_applied_undone_exported_and_saved_like_the_command_line \
            sessions::tests::native_a_chamfered_plate_with_constraints_keeps_them_byte_for_byte \
            sessions::tests::native_open_draws_from_the_sessions_own_copy_and_a_failed_open_leaves_nothing \
            sessions::tests::native_vertices_of_an_ordinary_offset_polygon_are_applied_like_the_command_line \
            sessions::tests::native_vertices_of_a_rectangle_under_a_chamfer_keep_the_chamfer_like_the_command_line \
            sessions::tests::native_a_refused_vertex_edit_changes_nothing_and_a_constrained_plate_offers_none \
            sessions::tests::native_replace_length_of_a_dimensioned_plate_under_a_chamfer_is_applied_like_the_command_line \
            sessions::tests::native_radius_and_fixed_centre_of_a_circle_are_applied_like_the_command_line \
            sessions::tests::native_a_solver_conflict_or_a_chamfer_that_no_longer_fits_changes_nothing
          do
            cargo test --release --features planegcs -p ferritecad-app --bin ferritecad-viewer "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee session-native.log
            if grep -q 'skipped:' session-native.log || ! grep -Fq "test $gate ... ok" session-native.log; then
              echo "::error::${gate} did not run and pass on this platform"
              exit 1
            fi
          done
          # §30C: the session step of the constraint edit itself, with the real solver.
          for gate in a_constraint_edit_is_a_session_step_beside_height_with_undo_and_redo \
            a_constraint_edit_from_an_older_version_or_without_edits_changes_nothing
          do
            cargo test --release --features planegcs -p ferritecad-jobs --test session "$gate" \
              -- --exact --nocapture --test-threads=1 2>&1 | tee session-constraints-job.log
            if grep -q 'skipped:' session-constraints-job.log || ! grep -Eq "^test $gate \.\.\. ok$" session-constraints-job.log; then
              echo "::error::${gate} did not run and pass on this platform"
              exit 1
            fi
          done
          # §30D: a saved Circle and an annulus (boundary first, and bore first)
          # applied through the window's real workers against the peer command line,
          # and the constraint editor's availability following the accepted version.
          # The saved model's exports go to the pinned independent reader below.
          analytic_dir="$RUNNER_TEMP/analytic-session"
          mkdir -p "$analytic_dir"
          analytic_artifacts="$analytic_dir"
          case '${{ matrix.name }}' in

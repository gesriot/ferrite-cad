            if grep -q 'skipped:' chamfer-kernel.log || ! grep -Fq "test $gate ... " chamfer-kernel.log \
              || ! grep -q '^test result: ok\. 1 passed; 0 failed' chamfer-kernel.log; then exit 1; fi

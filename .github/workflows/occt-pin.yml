# SPDX-License-Identifier: MIT
name: OCCT pin

# Builds Open CASCADE from source on all three product platforms, runs the
# smoke test against it, and reports everything needed to fill in the pin table
# in docs/build-occt.md.
#
# This is deliberately not part of CI. It takes tens of minutes per platform and
# is run when a version is being chosen or changed, not on every pull request.
#
# The deliverable is not "it compiled". It is the record: tag, commit, archive
# checksum and the exact toolchain each platform used. A pin established by hand
# rests on someone's memory of which compiler they had; this rests on the log.

on:
  workflow_dispatch:
    inputs:
      occt_tag:
        description: 'OCCT git tag, e.g. V8_0_1'
        required: true
        type: string
      expected_sha256:
        description: 'Optional: SHA-256 the source archive must match. Leave empty to discover it.'
        required: false
        type: string
      keep_build_cache:
        description: 'Reuse a cached OCCT build for this tag when one exists'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  OCCT_REPO: https://github.com/Open-Cascade-SAS/OCCT

jobs:
  # Resolves the tag once so all three platforms provably build the same bytes.
  # Letting each runner download independently would mean three unverified
  # downloads and no way to tell a mirror hiccup from a retagged release.
  resolve:
    name: Resolve tag and checksum
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      archive_url: ${{ steps.resolve.outputs.archive_url }}
    steps:
      - name: Resolve tag to a commit
        id: resolve
        # Dispatch inputs reach the shell as environment variables, never as
        # text spliced into the script. A tag containing a quote would otherwise
        # be running commands rather than naming a release.
        env:
          FCAD_TAG: ${{ inputs.occt_tag }}
        run: |
          set -euo pipefail
          tag="$FCAD_TAG"

          if ! git check-ref-format "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} is not a valid git tag name"
            exit 1
          fi

          # An annotated tag points at a tag object, not a commit; ^{} peels it.
          # Match the returned ref name exactly as well: ls-remote accepts ref
          # patterns, while this workflow accepts one concrete tag.
          remote_refs="$(git ls-remote \
            "$OCCT_REPO" "refs/tags/${tag}" "refs/tags/${tag}^{}")"
          commit="$(printf '%s\n' "$remote_refs" \
            | awk -F '\t' -v ref="refs/tags/${tag}^{}" '$2 == ref { print $1; exit }')"
          if [ -z "$commit" ]; then
            commit="$(printf '%s\n' "$remote_refs" \
              | awk -F '\t' -v ref="refs/tags/${tag}" '$2 == ref { print $1; exit }')"
          fi
          if [ -z "$commit" ]; then
            echo "::error::tag ${tag} does not exist in ${OCCT_REPO}"
            exit 1
          fi
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag ${tag} did not resolve to one SHA-1 commit: ${commit}"
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # Download by immutable commit, not by the tag a second time. If the
          # tag moves between this step and curl, the report must not name one
          # commit while the runners compile another.
          echo "archive_url=${OCCT_REPO}/archive/${commit}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tag ${tag} is commit ${commit}"

      - name: Download the source archive and checksum it
        id: checksum
        env:
          FCAD_ARCHIVE_URL: ${{ steps.resolve.outputs.archive_url }}
          FCAD_EXPECTED: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o occt.tar.gz "$FCAD_ARCHIVE_URL"
          sha256="$(sha256sum occt.tar.gz | cut -d' ' -f1)"
          bytes="$(stat -c%s occt.tar.gz)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "archive is $bytes bytes, sha256 $sha256"

          if [ -n "$FCAD_EXPECTED" ] && [ "$FCAD_EXPECTED" != "$sha256" ]; then
            echo "::error::archive checksum is $sha256 but $FCAD_EXPECTED was expected"
            exit 1
          fi

      - name: Warn that a GitHub source archive is a weak pin
        run: |
          cat <<'NOTE'
          ::warning::GitHub generates tag archives on demand rather than storing
          them, and their bytes have changed before when the git archive format
          changed. Treat the commit SHA as the authoritative pin and the archive
          SHA-256 as a check on one particular download. A build script that
          must be reproducible for years should clone the commit, not fetch the
          tarball.
          NOTE

  build:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Ninja on every platform, including Windows.
        #
        # A "Visual Studio <n> <year>" generator names one Visual Studio
        # release, and both the GitHub runner image and a current developer
        # machine have already moved past 2022 — a hardcoded generator fails
        # with "could not find any instance of Visual Studio" and would have to
        # be edited on every VS release. Ninja names no version, so the build
        # follows whichever MSVC is installed, and the run records which one
        # that was. It is also single-config, which removes --config from every
        # build and install line.
        include:
          - os: ubuntu-latest
            name: linux
            cmake_extra: ''
          - os: windows-latest
            name: windows
            # MinGW is on PATH on the runners, and CMake would otherwise pick
            # it over MSVC once Ninja is the generator.
            cmake_extra: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          - os: macos-latest
            name: macos
            cmake_extra: ''

    defaults:
      run:
        # One shell everywhere, so the build steps are the same text on all
        # three platforms and a difference in behaviour is a real difference.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          set -euo pipefail
          case '${{ matrix.name }}' in
            linux)
              sudo apt-get update
              # X11 and GL headers are needed even though FerriteCAD renders
              # through wgpu and never opens an OCCT viewer: XCAF links against
              # the Visualization toolkits, so TKService is built regardless and
              # it includes X11/Xlib.h. macOS and Windows use their native
              # windowing headers and need nothing extra.
              sudo apt-get install -y --no-install-recommends \
                ninja-build \
                libx11-dev libxext-dev libxmu-dev libxi-dev \
                libgl1-mesa-dev libglu1-mesa-dev
              ;;
            macos)
              brew install ninja
              ;;
            windows)
              # MSVC and CMake are preinstalled; Ninja is not guaranteed to be
              # on PATH outside a Visual Studio developer prompt.
              choco install ninja -y --no-progress
              ;;
          esac

      - name: Locate MSVC
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo ::error::vswhere found no Visual Studio with the C++ toolset
            exit /b 1
          )
          echo Visual Studio at %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set > vcvars-env.txt

      - name: Export the MSVC environment
        if: matrix.name == 'windows'
        run: |
          set -euo pipefail
          # Only the variables the compiler and linker actually need.
          #
          # Exporting the whole vcvars environment was a mistake: it publishes
          # around fifty names into every later step, one of which is the
          # generic `Platform`. Windows environment variables are
          # case-insensitive, so that entry displaced this workflow's own
          # FCAD_PLATFORM and a later step died on an unbound variable — after the
          # build and the smoke test had already succeeded. An allow-list keeps
          # the blast radius to names no one else would choose.
          # Matched case-insensitively: Windows spells it `Path`, not `PATH`,
          # and a case-sensitive pattern silently drops it — leaving cl.exe
          # off PATH and CMake unable to find any compiler at all.
          grep -Ei '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir)=' \
            vcvars-env.txt >> "$GITHUB_ENV"
          rm -f vcvars-env.txt
          echo "MSVC environment exported to subsequent steps"

      - name: Restore a cached OCCT build
        id: cache
        if: ${{ inputs.keep_build_cache }}
        uses: actions/cache/restore@v6
        with:
          path: vendor/install
          # Keyed on the commit rather than the tag: a moved tag must not
          # silently reuse the previous build. Architecture is independent of
          # OS, and v3 means the cache includes build provenance and the licence
          # report. Bump the schema when the OCCT configuration changes.
          key: occt-${{ needs.resolve.outputs.commit }}-${{ matrix.name }}-${{ runner.arch }}-v3

      - name: Fetch and verify the source archive
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FCAD_ARCHIVE_URL: ${{ needs.resolve.outputs.archive_url }}
          FCAD_EXPECTED: ${{ needs.resolve.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o occt.tar.gz "$FCAD_ARCHIVE_URL"

          expected="$FCAD_EXPECTED"
          case '${{ matrix.name }}' in
            macos) actual="$(shasum -a 256 occt.tar.gz | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum occt.tar.gz | cut -d' ' -f1)" ;;
          esac

          # Every platform must build byte-identical sources, or the pin means
          # nothing.
          if [ "$actual" != "$expected" ]; then
            echo "::error::archive checksum is $actual, the resolve job saw $expected"
            exit 1
          fi

          mkdir -p occt
          tar -xzf occt.tar.gz -C occt --strip-components=1
          echo "extracted $(find occt -mindepth 1 -maxdepth 1 | wc -l) top-level entries"

      - name: Configure OCCT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # These flags mirror docs/build-occt.md exactly. If configuring fails,
          # report it — do not reach for -DBUILD_LIBRARY_TYPE=Static, which
          # would change the licence position of the whole product.
          cmake -S occt -B occt-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Draw=OFF \
            -DUSE_TK=OFF -DUSE_TCL=OFF -DUSE_FREETYPE=OFF -DUSE_VTK=OFF \
            -DBUILD_DOC_Overview=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/vendor/install"

      - name: Assert the build is shared
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Read the value back rather than trusting that the flag was accepted:
          # an unknown option is only a warning to CMake.
          #
          # The cache *type* is deliberately not checked. OCCT declares
          # BUILD_LIBRARY_TYPE as a CACHE STRING only inside `if (NOT
          # BUILD_LIBRARY_TYPE)`, so passing the flag on the command line skips
          # that branch and leaves the entry UNINITIALIZED. Requiring
          # `:STRING=` therefore fails precisely when the flag *was* set.
          # What matters is the value, which OCCT then turns into
          # BUILD_SHARED_LIBS. The produced binaries are checked separately
          # below, and that is the stronger evidence.
          value="$(sed -n 's/^BUILD_LIBRARY_TYPE:[^=]*=//p' occt-build/CMakeCache.txt)"
          if [ "$value" != "Shared" ]; then
            echo "::error::OCCT configured with BUILD_LIBRARY_TYPE=${value:-<unset>}, not Shared"
            grep -E '^BUILD_(LIBRARY_TYPE|SHARED_LIBS)' occt-build/CMakeCache.txt || true
            exit 1
          fi
          echo "BUILD_LIBRARY_TYPE=Shared confirmed"

      - name: Build and install OCCT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake --build occt-build --parallel
          cmake --install occt-build

      - name: Locate the install
        id: occt
        run: |
          set -euo pipefail
          # OCCT's install layout differs by platform and by version, so the
          # package config and library directories are discovered rather than
          # assumed. This keeps the workflow working when the tag input changes.
          config="$(find vendor/install -name 'OpenCASCADEConfig.cmake' -print -quit)"
          if [ -z "$config" ]; then
            echo "::error::OpenCASCADEConfig.cmake not found under vendor/install"
            find vendor/install -maxdepth 3 -type d | head -40
            exit 1
          fi
          config_dir="$(cd "$(dirname "$config")" && pwd)"
          echo "config_dir=$config_dir" >> "$GITHUB_OUTPUT"

          case '${{ matrix.name }}' in
            windows) pattern='TKernel.dll' ;;
            macos)   pattern='libTKernel*.dylib' ;;
            *)       pattern='libTKernel.so*' ;;
          esac
          lib="$(find vendor/install -name "$pattern" -print -quit)"
          if [ -z "$lib" ]; then
            echo "::error::no shared TKernel found; the install is not a shared build"
            exit 1
          fi
          lib_dir="$(cd "$(dirname "$lib")" && pwd)"
          echo "lib_dir=$lib_dir" >> "$GITHUB_OUTPUT"

          echo "config: $config_dir"
          echo "libs:   $lib_dir"

      - name: Record OCCT build provenance
        id: provenance
        env:
          FCAD_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          FCAD_RUNNER_LABEL: ${{ matrix.os }}
          FCAD_CURRENT_RUNNER_OS: ${{ runner.os }}
          FCAD_CURRENT_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          metadata='vendor/install/.ferritecad-build-provenance'

          if [ "$FCAD_CACHE_HIT" != 'true' ]; then
            compiler_file="$(find occt-build -name 'CMakeCXXCompiler.cmake' -print -quit)"
            if [ -z "$compiler_file" ]; then
              echo "::error::CMake compiler record not found under occt-build"
              exit 1
            fi

            compiler_id="$(sed -n 's/^set(CMAKE_CXX_COMPILER_ID "\(.*\)")$/\1/p' "$compiler_file")"
            compiler_version="$(sed -n 's/^set(CMAKE_CXX_COMPILER_VERSION "\(.*\)")$/\1/p' "$compiler_file")"
            compiler_path="$(sed -n 's/^set(CMAKE_CXX_COMPILER "\(.*\)")$/\1/p' "$compiler_file")"
            if [ -z "$compiler_id" ] || [ -z "$compiler_version" ]; then
              echo "::error::configured C++ compiler identity is incomplete"
              cat "$compiler_file"
              exit 1
            fi

            cmake_version="$(cmake --version | head -1)"
            compiler="${compiler_id} ${compiler_version} (${compiler_path})"
            runner="${FCAD_RUNNER_LABEL} (${FCAD_CURRENT_RUNNER_OS}/${FCAD_CURRENT_RUNNER_ARCH}; ${ImageOS:-image unknown} ${ImageVersion:-version unknown})"
            {
              printf 'cmake=%s\n' "$cmake_version"
              printf 'compiler=%s\n' "$compiler"
              printf 'runner=%s\n' "$runner"
            } > "$metadata"
          fi

          if [ ! -f "$metadata" ]; then
            echo "::error::cached OCCT build has no provenance record"
            exit 1
          fi

          value() {
            sed -n "s/^$1=//p" "$metadata"
          }
          cmake_version="$(value cmake)"
          compiler="$(value compiler)"
          runner="$(value runner)"
          if [ -z "$cmake_version" ] || [ -z "$compiler" ] || [ -z "$runner" ]; then
            echo "::error::OCCT build provenance is incomplete"
            cat "$metadata"
            exit 1
          fi

          {
            echo "cmake=$cmake_version"
            echo "compiler=$compiler"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"
          cat "$metadata"

      - name: Record OCCT licence files
        env:
          FCAD_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # THIRD_PARTY_LICENSES.md makes shipping the LGPL text and the OCCT
          # exception a release gate. Record that they exist, so packaging is
          # not the first time anyone looks for them.
          #
          # Keep the record inside vendor/install so a cache hit reports what
          # was present in the source tree that produced that cached build.
          # Otherwise the missing (and deliberately uncached) source directory
          # would create a false licence warning on every reused build.
          report='vendor/install/.ferritecad-licence-report.md'
          # The backticks in the printf formats below are Markdown code spans,
          # not command substitution; single quotes are what keeps them literal.
          # shellcheck disable=SC2016
          if [ "$FCAD_CACHE_HIT" != 'true' ]; then
            : > "$report"
            for name in LICENSE_LGPL_21.txt OCCT_LGPL_EXCEPTION.txt; do
              path="$(find occt vendor/install -name "$name" -print -quit 2>/dev/null || true)"
              if [ -n "$path" ]; then
                printf -- '- `%s` present\n' "$name" >> "$report"
              else
                printf -- '- `%s` NOT FOUND\n' "$name" >> "$report"
                echo "::error::${name} was not found in the OCCT tree"
              fi
            done
          fi

          if [ ! -f "$report" ]; then
            echo "::error::cached OCCT build has no licence report"
            exit 1
          fi
          cp "$report" licences.md
          cat licences.md
          if grep -qF 'NOT FOUND' "$report"; then
            echo "::error::OCCT licence files are incomplete"
            exit 1
          fi

      # Save immediately after the install has been validated and its
      # provenance/licence records have been written. The combined cache
      # action saves only in its post-job hook, which is skipped when a later
      # smoke, adapter or dependency check fails; that turned a one-line CI
      # fix into another 53-minute Windows rebuild.
      - name: Save the fresh OCCT build
        if: ${{ inputs.keep_build_cache && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: vendor/install
          key: occt-${{ needs.resolve.outputs.commit }}-${{ matrix.name }}-${{ runner.arch }}-v3

      - name: Build the smoke test
        env:
          FCAD_OCCT_CONFIG_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # CMAKE_BUILD_RPATH bakes the OCCT location into the binary. On macOS
          # that matters: SIP strips DYLD_LIBRARY_PATH when a protected shell
          # spawns a process, so the environment-variable route is unreliable
          # exactly where it looks like it should work.
          cmake -S tools/occt-smoke -B smoke-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$FCAD_OCCT_CONFIG_DIR" \
            -DCMAKE_BUILD_RPATH="$FCAD_OCCT_LIB_DIR"
          cmake --build smoke-build --parallel

      - name: Run the smoke test
        id: smoke
        env:
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # The binary is built with an RPATH pointing at the OCCT libraries,
          # which is enough for what it links directly and not always enough
          # for what those libraries link in turn.
          case '${{ matrix.name }}' in
            windows)
              # RPATH does not exist on Windows; the loader searches PATH.
              export PATH="$FCAD_OCCT_LIB_DIR:$PATH"
              ;;
            linux)
              # Modern linkers emit RUNPATH rather than RPATH, and RUNPATH is
              # not transitive: it resolves the binary's own dependencies but
              # not theirs. OCCT toolkits pull each other in, so a library the
              # smoke test never names directly — libTKDE, for one — goes
              # unfound. LD_LIBRARY_PATH applies to the whole resolution.
              export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              ;;
            macos)
              # The CMAKE_BUILD_RPATH set above resolves OCCT's @rpath install
              # names against this exact install tree. This proves the
              # in-place build, not a relocatable app bundle; packaging must
              # establish its own bundle-relative RPATHs separately.
              ;;
          esac

          # Located rather than assumed, so the step does not silently depend on
          # the generator staying single-config.
          binary="$(find smoke-build -type f \( -name 'occt_smoke' -o -name 'occt_smoke.exe' \) -print -quit)"
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo "::error::no executable smoke binary under smoke-build"
            find smoke-build -name 'occt_smoke*' -type f || true
            exit 1
          fi
          echo "running $binary"

          # Failures are reported, never worked around. A step that does not
          # pass is a real limit of this OCCT version on this platform, and
          # that is exactly what the pin decision needs to know.
          "$binary" fixtures/step/canonical/02-flat-assembly.step \
            | tee smoke-output.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Test the Open CASCADE adapter against this build
        id: adapter
        env:
          FCAD_OCCT_CONFIG_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          # This is the one place the adapter must exist. Everywhere else a
          # missing Open CASCADE only warns and the tests skip, which is right
          # for a contributor without the kernel and wrong for a run whose
          # purpose is to prove the adapter works against the pinned version.
          export FERRITECAD_REQUIRE_OCCT=1
          # This run also carries both end-to-end STEP -> document -> GPU ->
          # pixel gates: the canonical clean import and the complex partial
          # import. A contributor with no adapter may skip those tests; this
          # workflow may not, or green would require reading its log to learn
          # whether either asserted path ran at all.
          export FERRITECAD_REQUIRE_GPU=1
          export OpenCASCADE_DIR="$FCAD_OCCT_CONFIG_DIR"

          case '${{ matrix.name }}' in
            windows)
              # No RPATH on Windows: the OCCT DLLs must be findable on PATH
              # when the test binary runs. The bridge itself is static.
              export PATH="$FCAD_OCCT_LIB_DIR:$PATH"

              # Git Bash prepends its own /usr/bin, which contains a GNU
              # `link.exe`. CMake is unaffected because it records the full
              # path to the compiler at configure time, but rustc invokes
              # link.exe by name and picks up the wrong one — "linking with
              # link.exe failed" naming a path under Git. Put the MSVC tools
              # ahead of it.
              if [ -n "${VCToolsInstallDir:-}" ]; then
                msvc_bin="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64"
                if [ -x "$msvc_bin/link.exe" ]; then
                  export PATH="$msvc_bin:$PATH"
                else
                  echo "::warning::no MSVC link.exe under $msvc_bin"
                fi
              fi
              echo "link.exe resolves to: $(command -v link || echo none)"
              ;;
            linux)
              # RUNPATH is not transitive, and the OCCT toolkits load each
              # other; the same reasoning as the smoke test above.
              export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              ;;
            macos)
              # build.rs embeds this OCCT install directory as an RPATH in the
              # ferritecad-occt package's own test executables. Cargo does not
              # propagate that package-local link argument to a downstream
              # binary such as the CLI, whose process-level tests launch it as
              # a child. Supply the raw install tree to dyld for this in-place
              # test. A shipped app must instead carry a bundle-relative
              # LC_RPATH and its dylibs; this does not claim to test packaging.
              export DYLD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
              ;;
          esac

          # Build the tests first so the executable can be inspected before it
          # is run.
          #
          # The licence position rests on Open CASCADE being linked
          # dynamically, so it is checked against the artefact rather than
          # assumed from the CMake flags. The artefact is the test executable,
          # not the shim: the shim is static and lives inside it, and it is the
          # executable that names Open CASCADE at run time.
          #
          # Kept in this step so dependency inspection and test execution use
          # the same binary and the same step-local PATH. On Windows the
          # workflow-wide vcvars export already supplies dumpbin to later
          # steps; the override above additionally guarantees that rustc sees
          # MSVC's link.exe ahead of Git Bash's unrelated utility.
          binary="$(cargo test -p ferritecad-occt --test occt_kernel --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "compiler-artifact")
                     | select(.target.name == "occt_kernel")
                     | .executable // empty' \
            | head -1)"
          if [ -z "$binary" ]; then
            echo "::error::no ferritecad-occt test executable was produced"
            exit 1
          fi
          echo "checking $binary"

          case '${{ matrix.name }}' in
            linux)
              ldd "$binary" | grep -i 'libTK' \
                || { echo "::error::the adapter names no Open CASCADE toolkit at run time"; exit 1; }
              ;;
            macos)
              otool -L "$binary" | grep -i 'libTK' \
                || { echo "::error::the adapter names no Open CASCADE toolkit at run time"; exit 1; }
              ;;
            windows)
              # `//DEPENDENTS` rather than `/DEPENDENTS`: MSYS rewrites a
              # leading slash into a Windows path, and the doubled form is the
              # escape that survives it.
              dumpbin //DEPENDENTS "$(cygpath -w "$binary")" | grep -i 'TK.*\.dll' \
                || { echo "::error::the adapter names no Open CASCADE DLL at run time"; exit 1; }
              ;;
          esac

          # The adapter's tests skip themselves when the crate was built
          # without a kernel, and a skipped test still reports as passed.
          # FERRITECAD_REQUIRE_OCCT=1 above is what stops a green step from
          # meaning "skipped": without a kernel the build fails outright.
          # Keep the successful corpus measurements too. The default harness
          # hides stdout/stderr for passing tests, which would prove only that
          # the policy held and lose the platform-specific limits and refusal
          # paths that this workflow exists to measure.
          cargo test -p ferritecad-occt --all-targets -- --nocapture 2>&1 \
            | tee adapter-test-output.txt

          # The CLI lives in another package, so the adapter command above
          # cannot discover its process-level gates. Ordinary CI builds the CLI
          # without OCCT and those tests deliberately skip their geometry
          # paths; run them here to prove filesystem publication and the real
          # document -> OCCT -> STL vertical slice on every product platform.
          #
          # Every test target, not a list of them: a gate that has to be added
          # here by hand is a gate that will one day be added everywhere else
          # and not here.
          #
          # Keep the output because it is useful evidence; unlike an ordinary
          # developer run, FERRITECAD_REQUIRE_GPU above makes a missing adapter
          # a failure rather than a green skip.
          cargo test -p ferritecad-cli --tests -- --nocapture

          # And the loader, for the same reason one step further up: everything
          # about it is settled against the mock, which cannot say whether the
          # numbers are real. Its OCCT gate is the only place a picture built
          # from a document on disk is measured against geometry Open CASCADE
          # actually computed.
          cargo test -p ferritecad-scene --tests -- --nocapture

      - name: Generate the STEP corpus and compare two runs
        env:
          FCAD_OCCT_CONFIG_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          cmake -S tools/build-step-corpus -B corpus-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$FCAD_OCCT_CONFIG_DIR" \
            -DCMAKE_BUILD_RPATH="$FCAD_OCCT_LIB_DIR"
          cmake --build corpus-build --parallel

          # The same runtime setup the smoke test needs, and for the same
          # reasons: RUNPATH is not transitive on Linux and does not exist on
          # Windows. Written out again rather than assumed, because the last
          # version of this step assumed and exited 127.
          case '${{ matrix.name }}' in
            windows)
              export PATH="$FCAD_OCCT_LIB_DIR:$PATH"
              ;;
            linux)
              export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              ;;
            macos)
              ;;
          esac

          binary="$(find corpus-build -type f \( -name 'step_corpus' -o -name 'step_corpus.exe' \) -print -quit)"
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo "the corpus generator was not built" >&2
            exit 1
          fi

          rm -rf step-corpus step-corpus-again
          mkdir -p step-corpus step-corpus-again
          "$binary" step-corpus
          "$binary" step-corpus-again

          # The contract is the model, not the encoding. Open CASCADE writes
          # colour statements in an order that varies between runs, so the STEP
          # bytes are allowed to differ; what may not differ is what a reader
          # makes of them.
          if ! diff -u step-corpus/SEMANTIC-MANIFEST.txt \
                     step-corpus-again/SEMANTIC-MANIFEST.txt; then
            echo "two generations disagree about the model" >&2
            exit 1
          fi
          echo "two generations produced the same semantic manifest"

          # Recorded so the difference between "the model changed" and "the
          # bytes moved" is visible in the report rather than inferred.
          for file in step-corpus/*.step; do
            name="$(basename "$file")"
            if cmp -s "$file" "step-corpus-again/$name"; then
              echo "  byte-identical  $name"
            else
              echo "  bytes differ    $name (permitted; the manifest agrees)"
            fi
          done

      - name: Measure what the pinned kernel makes of the corpus
        env:
          FCAD_OCCT_CONFIG_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          cmake -S tools/step-diagnostic -B diagnostic-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$FCAD_OCCT_CONFIG_DIR" \
            -DCMAKE_BUILD_RPATH="$FCAD_OCCT_LIB_DIR"
          cmake --build diagnostic-build --parallel

          case '${{ matrix.name }}' in
            windows) export PATH="$FCAD_OCCT_LIB_DIR:$PATH" ;;
            linux) export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ;;
            macos) ;;
          esac

          binary="$(find diagnostic-build -type f \( -name 'step_diagnostic' -o -name 'step_diagnostic.exe' \) -print -quit)"
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo "the diagnostic tool was not built" >&2
            exit 1
          fi

          # Both halves of the corpus, so the sound files are the control for
          # the damaged ones. This measures; it does not judge. What FerriteCAD
          # should do about each outcome is a policy decision, and the point of
          # the matrix is that it will be made on data from the kernel that
          # ships rather than on the one that happened to be installed.
          "$binary" fixtures/step/canonical/*.step fixtures/step/damaged/*.step \
            fixtures/step/interoperability/*.stp \
            | tee step-import-matrix.txt

          echo "--- summary ---"
          grep -E '^[0-9]|read |load fails|transfer ' step-import-matrix.txt | head -80

      - name: Upload the STEP import matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step-import-matrix-${{ matrix.name }}
          path: step-import-matrix.txt
          if-no-files-found: warn

      - name: Ask whether a definition has an identity that comes from the file
        env:
          FCAD_OCCT_CONFIG_DIR: ${{ steps.occt.outputs.config_dir }}
          FCAD_OCCT_LIB_DIR: ${{ steps.occt.outputs.lib_dir }}
        run: |
          set -euo pipefail
          cmake -S tools/step-key-probe -B key-probe-build -G Ninja ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$FCAD_OCCT_CONFIG_DIR" \
            -DCMAKE_BUILD_RPATH="$FCAD_OCCT_LIB_DIR"
          cmake --build key-probe-build --parallel

          case '${{ matrix.name }}' in
            windows) export PATH="$FCAD_OCCT_LIB_DIR:$PATH" ;;
            linux) export LD_LIBRARY_PATH="$FCAD_OCCT_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ;;
            macos) ;;
          esac

          binary="$(find key-probe-build -type f \( -name 'step_key_probe' -o -name 'step_key_probe.exe' \) -print -quit)"
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo "the key probe was not built" >&2
            exit 1
          fi

          # Both halves of the corpus. The damaged files matter here as much as
          # the sound ones: a key that exists only while a file is undamaged is
          # a key that disappears exactly when a user needs to be told which
          # component stopped resolving.
          inputs=(fixtures/step/canonical/*.step fixtures/step/damaged/*.step \
                  fixtures/step/interoperability/*.stp)
          "$binary" "${inputs[@]}" | tee step-key-matrix.txt

          # The interoperability fixture is the ownership case this slice
          # exists to guard. These are source relationships and XDE
          # associations, not geometry-derived expectations. Keep the checks
          # beside the full report so a renamed or missing section cannot make
          # a sequence of independent grep commands accidentally pass.
          complex="$(sed -n '/^c3d-ap203-complex-assembly.stp$/,/^$/p' \
            step-key-matrix.txt)"
          if ! grep -Fxq '# typed ambiguity rejected yes' step-key-matrix.txt; then
            echo "::error::the shared identity implementation accepted ambiguity"
            exit 1
          fi
          require_complex() {
            if ! grep -Fq "$1" <<<"$complex"; then
              echo "::error::the complex AP203 key report is missing: $1"
              printf '%s\n' "$complex"
              exit 1
            fi
          }
          require_complex '    definitions 46'
          require_complex '    roots 1'
          require_complex '    placed occurrences 139'
          require_complex '    assemblies with equal children but distinct products 1 pair(s)'
          require_complex '    same after reversed traversal yes'
          require_complex '    foreign source entity rejected yes'
          require_complex 'identity index model scans 1  entities'
          require_complex 'non-transforming relationships 35'
          require_complex 'transforming relationships ignored 67'
          require_complex 'XDE product associations 46'
          require_complex 'ambiguous source identities 0'
          require_complex '        durable key         step.product_definition#1'
          require_complex '        durable key         step.product_definition#1764'
          require_complex '        durable key         step.product_definition#2927'
          require_complex '    product definition  present 46/46  unique yes  same on a second read yes'

          # The gate. Durable selection into an imported assembly cannot be
          # built on a key that is missing, ambiguous or different on a second
          # reading. The deliberately collided file is expected to demonstrate
          # that refusal boundary; every other file that produced a scene must
          # offer the key. This is a fact the probe counts, not a verdict it
          # reaches.
          total="$(sed -n 's/^ *files with definitions \([0-9]*\)$/\1/p' step-key-matrix.txt)"
          examined="$(sed -n 's/^ *files examined \([0-9]*\)$/\1/p' step-key-matrix.txt)"
          if [ "$examined" != "${#inputs[@]}" ]; then
            echo "::error::the probe reported $examined files but was given ${#inputs[@]}"
            exit 1
          fi
          # Independent denominator: the diagnostic probe above already said
          # which files transferred. If the key probe silently loses one of
          # those files, N/N with a smaller N must not stay green.
          transferred="$(grep -cE '^ +transfer succeeded\r?$' step-import-matrix.txt)"
          if [ "$total" != "$transferred" ]; then
            echo "::error::the key probe found definitions in $total files, but $transferred transferred"
            exit 1
          fi
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::the probe found no file with definitions at all"
            exit 1
          fi
          # The gate is an exact set, not a count. One file in the corpus is
          # built to collide product definition identifiers, and it must go on
          # having no key: a candidate that stops working on a sound file and a
          # candidate that starts working on that one are both regressions, and
          # only naming the files catches the second.
          expected='06-duplicate-product-definition.step'
          actual="$(sed -n '/^ *product definition usable on /{n;s/^ *unusable on: *//;s/\r$//;p;}' \
            step-key-matrix.txt)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PRODUCT_DEFINITION is unusable on [$actual]; expected exactly [$expected]"
            grep -A 1 -E 'usable on' step-key-matrix.txt
            exit 1
          fi
          echo "PRODUCT_DEFINITION is present, unique and unchanged on a second read"
          echo "for every file with definitions except the one built to collide identifiers"

      - name: Upload the definition key matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step-key-matrix-${{ matrix.name }}
          path: step-key-matrix.txt
          if-no-files-found: warn

      - name: Upload the STEP corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step-corpus-${{ matrix.name }}
          path: step-corpus
          if-no-files-found: warn

      - name: Write the pin report
        if: always()
        env:
          FCAD_PLATFORM: ${{ matrix.name }}
          FCAD_RUNNER_IMAGE: ${{ steps.provenance.outputs.runner }}
          FCAD_JOB_STATUS: ${{ job.status }}
          FCAD_CMAKE_VERSION: ${{ steps.provenance.outputs.cmake }}
          FCAD_COMPILER_VERSION: ${{ steps.provenance.outputs.compiler }}
          FCAD_CACHE_STATE: ${{ steps.cache.outputs.cache-hit == 'true' && 'reused' || 'cache miss (build attempted)' }}
        run: |
          set -euo pipefail
          # Backticks in the printf formats are Markdown code spans.
          # shellcheck disable=SC2016
          {
            printf '### %s (`%s`)\n\n' "$FCAD_PLATFORM" "$FCAD_RUNNER_IMAGE"
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Result | %s |\n' "$FCAD_JOB_STATUS"
            printf '| CMake | %s |\n' "$FCAD_CMAKE_VERSION"
            printf '| Compiler | %s |\n' "$FCAD_COMPILER_VERSION"
            printf '| OCCT build cache | %s |\n' "$FCAD_CACHE_STATE"
            echo
            echo "Licence files:"
            echo
            cat licences.md 2>/dev/null || echo '- (not recorded; the build did not reach that step)'
            echo
            echo "<details><summary>Smoke test output</summary>"
            echo
            echo '```'
            cat smoke-output.txt 2>/dev/null || echo '(the smoke test did not produce output)'
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>Adapter tests and fillet/shell corpus</summary>"
            echo
            echo '```'
            cat adapter-test-output.txt 2>/dev/null || echo '(the adapter tests did not produce output)'
            echo '```'
            echo
            echo "</details>"
            echo
          } > "pin-report-${FCAD_PLATFORM}.md"

          cat "pin-report-${FCAD_PLATFORM}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pin report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: occt-pin-${{ matrix.name }}
          path: |
            pin-report-${{ matrix.name }}.md
            smoke-output.txt
            adapter-test-output.txt
          if-no-files-found: warn

  compare_corpus:
    name: Compare STEP corpus semantics and diagnostics
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all three generated corpora
        uses: actions/download-artifact@v8
        with:
          pattern: step-corpus-*
          path: step-corpora

      - name: Require one identical semantic manifest per platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(step-corpora/step-corpus-*/SEMANTIC-MANIFEST.txt)
          if [ "${#manifests[@]}" -ne 3 ]; then
            echo "::error::expected three platform manifests, found ${#manifests[@]}"
            printf '  %s\n' "${manifests[@]}"
            exit 1
          fi

          reference="${manifests[0]}"
          for manifest in "${manifests[@]}"; do
            sha256sum "$manifest"
            if ! diff -u "$reference" "$manifest"; then
              echo "::error::$manifest disagrees with $reference"
              exit 1
            fi
          done
          echo "all three platforms produced one semantic manifest" \
            >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Download all three import matrices
        uses: actions/download-artifact@v8
        with:
          pattern: step-import-matrix-*
          path: step-matrices

      - name: Require one identical normalized matrix per platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          matrices=(step-matrices/step-import-matrix-*/step-import-matrix.txt)
          if [ "${#matrices[@]}" -ne 3 ]; then
            echo "::error::expected three platform matrices, found ${#matrices[@]}"
            printf '  %s\n' "${matrices[@]}"
            exit 1
          fi

          # GitHub's Windows shell makes tee write CRLF while the same command
          # writes LF on Unix. That byte belongs to the shell artefact, not to
          # Open CASCADE's behaviour, so compare after removing only a trailing
          # CR from each line. The uploaded raw reports remain untouched.
          normalized_dir="$(mktemp -d)"
          normalized=()
          for matrix in "${matrices[@]}"; do
            platform="$(basename "$(dirname "$matrix")")"
            output="$normalized_dir/$platform.txt"
            sed 's/\r$//' "$matrix" > "$output"
            normalized+=("$output")
          done

          reference="${normalized[0]}"
          for matrix in "${normalized[@]}"; do
            sha256sum "$matrix"
            if ! diff -u "$reference" "$matrix"; then
              echo "::error::$matrix disagrees with $reference after CRLF normalization"
              exit 1
            fi
          done
          echo "all three platforms produced one normalized STEP import matrix" \
            >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Download all three definition key matrices
        uses: actions/download-artifact@v8
        with:
          pattern: step-key-matrix-*
          path: key-matrices

      - name: Require one identical definition key matrix per platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          matrices=(key-matrices/step-key-matrix-*/step-key-matrix.txt)
          if [ "${#matrices[@]}" -ne 3 ]; then
            echo "::error::expected three platform key matrices, found ${#matrices[@]}"
            printf '  %s\n' "${matrices[@]}"
            exit 1
          fi

          # A key that differs between platforms is not a key. The identifiers
          # come from the file, so agreement here is the claim being tested:
          # that what FerriteCAD would store on one operating system is what it
          # would look up on another. CRLF is normalized for the same reason as
          # the import matrix above, and the uploaded reports stay untouched.
          normalized_dir="$(mktemp -d)"
          normalized=()
          for matrix in "${matrices[@]}"; do
            platform="$(basename "$(dirname "$matrix")")"
            output="$normalized_dir/$platform.txt"
            sed -e 's/\r$//' -e '/^# Measured with Open CASCADE/d' "$matrix" > "$output"
            normalized+=("$output")
          done

          reference="${normalized[0]}"
          for matrix in "${normalized[@]}"; do
            sha256sum "$matrix"
            if ! diff -u "$reference" "$matrix"; then
              echo "::error::$matrix disagrees with $reference after normalization"
              exit 1
            fi
          done
          echo "all three platforms agree on every definition key" \
            >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$reference" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Pin summary
    needs: [resolve, build, compare_corpus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        id: download
        if: needs.resolve.result == 'success'
        continue-on-error: true
        with:
          pattern: occt-pin-*
          path: reports

      - name: Assemble the pin record
        env:
          FCAD_TAG: ${{ inputs.occt_tag }}
          FCAD_COMMIT: ${{ needs.resolve.outputs.commit }}
          FCAD_SHA256: ${{ needs.resolve.outputs.sha256 }}
          FCAD_RESOLVE_RESULT: ${{ needs.resolve.result }}
          FCAD_BUILD_RESULT: ${{ needs.build.result }}
          FCAD_CORPUS_RESULT: ${{ needs.compare_corpus.result }}
        run: |
          set -euo pipefail
          # Backticks in the printf formats are Markdown code spans.
          # shellcheck disable=SC2016
          {
            echo "## OCCT pin candidate"
            echo
            echo "Paste into the table in \`docs/build-occt.md\` only if all three"
            echo "platforms passed. A pin recorded from two green platforms and one"
            echo "skipped is not a pin."
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Tag | `%s` |\n' "$FCAD_TAG"
            printf '| Commit | `%s` |\n' "$FCAD_COMMIT"
            printf '| Source archive SHA-256 | `%s` |\n' "$FCAD_SHA256"
            printf '| Resolve result | %s |\n' "$FCAD_RESOLVE_RESULT"
            printf '| Build result | %s |\n' "$FCAD_BUILD_RESULT"
            printf '| STEP corpus semantic comparison | %s |\n' "$FCAD_CORPUS_RESULT"
            echo
            echo "The commit is the authoritative pin. The archive checksum"
            echo "covers one download of a tarball GitHub generates on demand."
            echo
            shopt -s nullglob
            reports=(reports/*/pin-report-*.md)
            if [ "${#reports[@]}" -eq 0 ]; then
              echo '_No platform reports were uploaded._'
            else
              for report in "${reports[@]}"; do
                cat "$report"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any platform did not pass
        if: always() && (needs.resolve.result != 'success' || needs.build.result != 'success' || needs.compare_corpus.result != 'success' || steps.download.outcome == 'failure')
        run: |
          echo "::error::not every platform passed, the STEP corpus disagreed, or the pin record is incomplete; this tag is not pinnable yet"
          exit 1
